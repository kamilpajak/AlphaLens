---
# AlphaLens cron-observability alert rules.
#
# Loaded by the existing (shared) Prometheus container on the VPS. This repo
# file is the SoT; the live copy (~/monitoring/prometheus/alphalens.rules) is
# converged to the origin/main blob by the hourly
# alphalens-prometheus-rules-sync timer, so MERGING TO MAIN IS THE DEPLOY —
# live picks a change up within ~1h. Emergency override only (sync broken):
# copy this file over the live one, then:
#
#     docker exec prometheus kill -HUP 1
#
# Lint locally with ``just lint-rules`` (containerised promtool, pinned to the
# VPS Prometheus version — no native install needed). The same command runs as
# the CI job "prometheus rules (promtool)".
#
# PromQL EXPRESSION SYNTAX is checked ONLY by that promtool gate. The unit
# tests below parse this file as YAML, where ``expr`` is an opaque string; a
# malformed expression passes every one of them and then makes Prometheus
# reject the WHOLE file on reload, silently stopping all rules at once.
#
# Pre-merge test coverage at
# ``apps/alphalens-research/tests/test_monitoring_alerts.py`` (structure only):
#  - YAML well-formed
#  - every job emits has at least one staleness rule
#  - alert thresholds expressed as integer seconds (not human strings)
#  - no duplicate alertname/job combinations
groups:
  - name: alphalens-cron-health
    rules:
      # ---------------------------------------------------------------
      # Staleness — fires when a job has not had a successful run within
      # ~2× its expected cadence. Thresholds are deliberately loose so
      # one transient miss (e.g. SEC EDGAR 503, AV quota burn) does not
      # page the operator; only a sustained outage trips the alert.
      #
      # The ``for: 5m`` clause adds a second debounce so a metric
      # update lagged by the scrape interval cannot flap the alert.
      # ---------------------------------------------------------------

      # Two paired alerts per job, deliberately split (2026-05-31):
      #
      #   * AlphalensJobStale         — fires when the metric EXISTS but
      #     is older than ~2× its cadence. Reports the real staleness
      #     duration via ``humanizeDuration``.
      #   * AlphalensJobMetricMissing — fires when the series is ABSENT
      #     (fresh VPS that never ran the job, textfile-collector
      #     misconfigured, node_exporter unable to read the dir).
      #     Without this guard a missing series silently disables the
      #     staleness alert — the worst class of monitoring blind spot.
      #     Zen pre-merge review of PR #312 pinned the guard.
      #
      # They were a single ``(threshold) or absent()`` rule until a
      # missing metric produced a self-contradictory page: ``absent()``
      # fires with the literal value 1, so the shared
      # ``humanizeDuration`` annotation rendered "stale > 70 days / last
      # run 1s ago" (real incident: monthly job before its first VPS
      # run, 2026-05-31). Splitting lets each failure mode carry an
      # honest, distinct message.
      #
      # Note on grouping: ``absent(metric{job="X"})`` propagates the
      # equality matcher ``job="X"`` onto its 1-element output (only
      # regex matchers get dropped), so the MetricMissing alerts still
      # carry the ``job`` label and group per-job under Alertmanager's
      # ``group_by: [alertname, job]``. Do not "fix" this by adding a
      # label_replace — it is not missing.

      - alert: AlphalensJobStale
        expr: time() - alphalens_job_last_success_timestamp_seconds{job="edgar-detect"} > 1800
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: edgar-detect
        annotations:
          summary: "edgar-detect stale > 30 min (expected 15-min cadence)"
          description: "Last successful run was {{ $value | humanizeDuration }} ago."

      - alert: AlphalensJobMetricMissing
        expr: absent(alphalens_job_last_success_timestamp_seconds{job="edgar-detect"})
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: edgar-detect
        annotations:
          summary: "edgar-detect success metric missing"
          description: "No success metric for edgar-detect. The job has not run since metrics were enabled (e.g. a freshly migrated unit before its first run), or the textfile collector / node_exporter scrape is broken. Clears after the first successful run."

      - alert: AlphalensJobStale
        expr: time() - alphalens_job_last_success_timestamp_seconds{job="literature-scan-weekly"} > 1209600
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: literature-scan-weekly
        annotations:
          summary: "literature-scan-weekly stale > 14 days (expected 7-day cadence)"
          description: "Last successful run was {{ $value | humanizeDuration }} ago."

      - alert: AlphalensJobMetricMissing
        expr: absent(alphalens_job_last_success_timestamp_seconds{job="literature-scan-weekly"})
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: literature-scan-weekly
        annotations:
          summary: "literature-scan-weekly success metric missing"
          description: "No success metric for literature-scan-weekly. The job has not run since metrics were enabled (e.g. a freshly migrated unit before its first run), or the textfile collector / node_exporter scrape is broken. Clears after the first successful run."

      - alert: AlphalensJobStale
        expr: time() - alphalens_job_last_success_timestamp_seconds{job="literature-scan-monthly"} > 6048000
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: literature-scan-monthly
        annotations:
          summary: "literature-scan-monthly stale > 70 days (expected 30-day cadence)"
          description: "Last successful run was {{ $value | humanizeDuration }} ago."

      - alert: AlphalensJobMetricMissing
        expr: absent(alphalens_job_last_success_timestamp_seconds{job="literature-scan-monthly"})
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: literature-scan-monthly
        annotations:
          summary: "literature-scan-monthly success metric missing"
          description: "No success metric for literature-scan-monthly. The job has not run since metrics were enabled (e.g. a freshly migrated unit before its first run), or the textfile collector / node_exporter scrape is broken. Clears after the first successful run."

      # thematic-build moved from 1×/day → 6×/day (every 4h at HH:30
      # UTC) in PR-F (epic #295, issue #300). 43200s = 12h = 3× the
      # 4h interval — DELIBERATELY asymmetric vs the other 4 services
      # which use 2× cadence. Justification: a thematic run is
      # 15-20 min wall time and each Gemini Pro/Flash stage can take
      # 5-10 min of API latency on its own. A 2× threshold (8h) would
      # page on one transient Gemini RPM blip; 3× gives one missed
      # slot's worth of slack while still surfacing two consecutive
      # misses within half a day. Pinned by PR-F zen pre-merge review.
      - alert: AlphalensJobStale
        expr: time() - alphalens_job_last_success_timestamp_seconds{job="thematic-build"} > 43200
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: thematic-build
        annotations:
          summary: "thematic-build stale > 12h (expected 4h cadence)"
          description: "Last successful run was {{ $value | humanizeDuration }} ago."

      - alert: AlphalensJobMetricMissing
        expr: absent(alphalens_job_last_success_timestamp_seconds{job="thematic-build"})
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: thematic-build
        annotations:
          summary: "thematic-build success metric missing"
          description: "No success metric for thematic-build. The job has not run since metrics were enabled (e.g. a freshly migrated unit before its first run), or the textfile collector / node_exporter scrape is broken. Clears after the first successful run."

      # edge-mirror fires on a successful compute run (OnSuccess=) PLUS an
      # hourly self-heal timer that also covers the failure/timeout path. It is
      # the Postgres mirror for the /edge dashboard. 36h = 1.5× the 24h daily
      # cadence — deliberately looser than the 48h compute-job threshold so the
      # two alerts do not fire simultaneously on a routine delay. The ``max()``
      # aggregation is used (not a direct series reference) because the edge-mirror
      # unit fires frequently (compute handoff + hourly timer) and the alert is
      # meant to detect a SUSTAINED absence, not a single missed run. The
      # description calls out that /edge staleness is independent of whether the
      # compute job itself succeeded — the key blind spot this alert closes
      # (the original incident: compute job SIGKILL-timed-out, ExecStartPost never
      # fired, /edge frozen 2+ days with no page).
      - alert: AlphalensEdgeStale
        expr: time() - max(alphalens_job_last_success_timestamp_seconds{job="edge-mirror"}) > 129600  # 36h
        for: 15m
        labels:
          severity: warning
          route: telegram
          unit: edge-mirror
        annotations:
          summary: "/edge Postgres mirror has not refreshed in >36h"
          description: "alphalens-edge-mirror has not succeeded for {{ $value | humanizeDuration }} — /edge is stale regardless of whether the compute job 'succeeded'."

      # feedback-shadow-returns runs nightly at 06:30 UTC (Track A v2
      # PR-T). 172800s = 48h = 2× the daily cadence, matching the other
      # daily jobs (form4-incremental). The sweep exits 0 even on nights that price
      # 0 matured dates (per-ticker resilience), so last_success refreshes
      # every night — staleness here cleanly catches "the nightly sweep
      # stopped running", which the exit-code AlphalensJobFailed cannot.
      # Runs every calendar night (no trading-day gate), so no weekend
      # false-page concern.
      - alert: AlphalensJobStale
        expr: time() - alphalens_job_last_success_timestamp_seconds{job="feedback-shadow-returns"} > 172800
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: feedback-shadow-returns
        annotations:
          summary: "feedback-shadow-returns stale > 48h (expected daily cadence)"
          description: "Last successful run was {{ $value | humanizeDuration }} ago."

      - alert: AlphalensJobMetricMissing
        expr: absent(alphalens_job_last_success_timestamp_seconds{job="feedback-shadow-returns"})
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: feedback-shadow-returns
        annotations:
          summary: "feedback-shadow-returns success metric missing"
          description: "No success metric for feedback-shadow-returns. The job has not run since metrics were enabled (e.g. a freshly installed unit before its first run), or the textfile collector / node_exporter scrape is broken. Clears after the first successful run."

      # form4-incremental runs daily at 02:30 UTC (Form-4 daily-incremental
      # ingest). 172800s = 48h = 2× the daily cadence, matching
      # feedback-shadow-returns. The fixed-lookback window
      # makes a one-night miss self-heal on the next overlapping run, and the job
      # exits 0 even on a transient-403 night, so last_success refreshes nightly —
      # staleness here cleanly catches "the daily ingest stopped running".
      - alert: AlphalensJobStale
        expr: time() - alphalens_job_last_success_timestamp_seconds{job="form4-incremental"} > 172800
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: form4-incremental
        annotations:
          summary: "form4-incremental stale > 48h (expected daily cadence)"
          description: "Last successful run was {{ $value | humanizeDuration }} ago."

      - alert: AlphalensJobMetricMissing
        expr: absent(alphalens_job_last_success_timestamp_seconds{job="form4-incremental"})
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: form4-incremental
        annotations:
          summary: "form4-incremental success metric missing"
          description: "No success metric for form4-incremental. The job has not run since metrics were enabled (e.g. a freshly installed unit before its first run), or the textfile collector / node_exporter scrape is broken. Clears after the first successful run."

      # grouped-daily-topup runs daily at 01:30 UTC (split-adjusted grouped-daily
      # history top-up that backs the O'Neil RS term). 172800s = 48h = 2× the daily
      # cadence, matching the other nightly backfills. The self-sizing top-up makes a
      # one-night miss self-heal on the next run, and the job exits 0 even on a
      # transient fetch night, so last_success refreshes nightly — staleness here
      # cleanly catches "the RS history top-up stopped running".
      - alert: AlphalensJobStale
        expr: time() - alphalens_job_last_success_timestamp_seconds{job="grouped-daily-topup"} > 172800
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: grouped-daily-topup
        annotations:
          summary: "grouped-daily-topup stale > 48h (expected daily cadence)"
          description: "Last successful run was {{ $value | humanizeDuration }} ago. The O'Neil RS history store is going stale; RS-approx nulls for asofs whose 252-session lookback falls in the gap."

      - alert: AlphalensJobMetricMissing
        expr: absent(alphalens_job_last_success_timestamp_seconds{job="grouped-daily-topup"})
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: grouped-daily-topup
        annotations:
          summary: "grouped-daily-topup success metric missing"
          description: "No success metric for grouped-daily-topup. The unit has not run since metrics were enabled (freshly installed before its first run), or the textfile collector scrape is broken. Clears after the first successful run."

      # ---------------------------------------------------------------
      # Market-cap bracket-cost replay (PR #1087). Daily, and the cadence is
      # forced rather than chosen: brand-new rows draw from a hardcoded
      # 50-per-run budget while the funnel adds ~26 proposals a day, so a
      # weekly fire would fall permanently behind.
      #
      # This job produces no dashboard and nobody looks at it daily, which is
      # exactly why it needs a staleness alert: a silent stop would surface
      # only in October as "the measurement never matured", by which time the
      # lost weeks are unrecoverable.
      # ---------------------------------------------------------------
      - alert: AlphalensJobStale
        expr: time() - alphalens_job_last_success_timestamp_seconds{job="bracket-cost"} > 172800
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: bracket-cost
        annotations:
          summary: "bracket-cost stale > 48h (expected daily cadence)"
          description: "Last successful run was {{ $value | humanizeDuration }} ago. The bracket-cost replay has stopped advancing its ladders, so the measurement of what the market-cap filter discards is frozen and its maturity date slips by one day per day of outage."

      - alert: AlphalensJobMetricMissing
        expr: absent(alphalens_job_last_success_timestamp_seconds{job="bracket-cost"})
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: bracket-cost
        annotations:
          summary: "bracket-cost success metric missing"
          description: "No success metric for bracket-cost. The unit has not run since metrics were enabled (freshly installed before its first run), or the textfile collector scrape is broken. Clears after the first successful run."

      # ---------------------------------------------------------------
      # waiting:data wake-date notifier (alphalens-issue-wake). Daily, and the
      # only job here whose HEALTHY behaviour is to send nothing.
      #
      # That is what makes the pair mandatory rather than nice to have: a dead
      # timer and a day with nothing due are indistinguishable on Telegram. The
      # failure is silent AND cumulative — every issue parked on a future date
      # sleeps through its wake and stays parked, and the longer the outage the
      # more of them pile up behind it. The exit-code alert cannot see this
      # either; a job that never runs never reports a bad exit.
      # ---------------------------------------------------------------
      - alert: AlphalensJobStale
        expr: time() - alphalens_job_last_success_timestamp_seconds{job="issue-wake"} > 172800
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: issue-wake
        annotations:
          summary: "issue-wake stale > 48h (expected daily cadence)"
          description: "Last successful run was {{ $value | humanizeDuration }} ago. The wake-date notifier has stopped running, so waiting:data issues whose Wake date has arrived are not being unlabelled or announced — and its silence is indistinguishable from a quiet day."

      - alert: AlphalensJobMetricMissing
        expr: absent(alphalens_job_last_success_timestamp_seconds{job="issue-wake"})
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: issue-wake
        annotations:
          summary: "issue-wake success metric missing"
          description: "No success metric for issue-wake. The unit has not run since metrics were enabled (freshly installed before its first run), or the textfile collector scrape is broken. Clears after the first successful run."

      # ---------------------------------------------------------------
      # Live-rules sync (alphalens-prometheus-rules-sync, issue #1073). Hourly,
      # and the job that deploys THIS file: it converges the live VPS copy to
      # the origin/main blob (backup -> promtool check -> atomic replace ->
      # HUP -> fingerprint verification).
      #
      # 7200 = 2x the hourly cadence, the edgar-detect 2x precedent — tight
      # on purpose: every hour the sync stays dead is an hour a merged rule
      # change is not live, which re-opens the drift class that bit three
      # times (missing rules 2026-05-31, absent new alerts 2026-08-19, a
      # metric rename 2026-08-20). These two rules keep firing from the LIVE
      # rules already loaded, which is what makes a dead sync visible at all.
      # ---------------------------------------------------------------
      - alert: AlphalensJobStale
        expr: time() - alphalens_job_last_success_timestamp_seconds{job="prometheus-rules-sync"} > 7200
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: prometheus-rules-sync
        annotations:
          summary: "prometheus-rules-sync stale > 2h (expected hourly cadence)"
          description: "Last successful run was {{ $value | humanizeDuration }} ago. The live-rules sync has stopped converging the VPS Prometheus with origin/main — a merged alert change is no longer deploying itself, and the live rules drift further behind main for every hour this lasts."

      - alert: AlphalensJobMetricMissing
        expr: absent(alphalens_job_last_success_timestamp_seconds{job="prometheus-rules-sync"})
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: prometheus-rules-sync
        annotations:
          summary: "prometheus-rules-sync success metric missing"
          description: "No success metric for prometheus-rules-sync. The unit has not run since metrics were enabled (freshly installed before its first run), or the textfile collector scrape is broken. Clears after the first successful run."

      # A run that HAPPENS but fails is invisible to the staleness pair only
      # until its second consecutive failure: the sync emits a zero-initialised
      # one-hot outcome family every run, and a run is healthy exactly when one
      # of the two success labels (in_sync/synced) is 1. "No success label
      # reached 1 anywhere in a window covering two hourly fires" is therefore
      # the sustained-failure signal — and unlike a per-label
      # min_over_time(...) > 0 it also catches two runs failing with DIFFERENT
      # outcomes (fetch_failed then check_failed). sum() over an empty vector
      # is empty, so an absent family stays quiet here — absence is the
      # MetricMissing page above. GAUGES, not counters: max_over_time only.
      - alert: AlphalensPrometheusRulesSyncFailed
        expr: sum(max_over_time(alphalens_rules_sync_outcome{outcome=~"in_sync|synced"}[150m])) == 0
        for: 15m
        labels:
          severity: warning
          route: telegram
          unit: prometheus-rules-sync
        annotations:
          summary: "live Prometheus rules no longer converging with main (sync failing on consecutive runs)"
          description: "alphalens_rules_sync_outcome reported no in_sync/synced run across the last two hourly fires — git fetch, the in-container promtool check, or the reload verification is failing, and merged alert changes are NOT reaching the live rules file. Check `journalctl --user -u alphalens-prometheus-rules-sync.service` for which stage failed. While it stays broken, the emergency override is the manual copy of the repo alphalens.yaml over the live rules file + `docker exec prometheus kill -HUP 1`."

      # ---------------------------------------------------------------
      # VIX regime-cache freshness (Track A v2 PR-2 follow-up).
      # ---------------------------------------------------------------
      #
      # The Django feedback POST path stamps ``market_regime_at_entry`` from
      # ``alphalens_feedback.regime.get_cached_vix``, which silently returns
      # ``None`` (→ regime degrades to "unknown") once the cache ages past the
      # 96h reader ceiling (``_VIX_MAX_AGE_SECONDS``). The refresh step in
      # run_thematic_day.sh is best-effort (``|| echo WARN``), so a persistently
      # dead FRED refresher produces NO signal on its own — every new decision
      # quietly loses its regime label and any per-regime feedback analytics
      # get poisoned at the source. ``alphalens cache refresh-vix``
      # now emits ``alphalens_vix_cache_fetched_at_timestamp_seconds`` (a GAUGE:
      # the epoch the cache was written) so these two rules can alert.
      #
      # This is NOT a cron systemd unit — the refresh runs INLINE in the
      # thematic build — so the rules carry a DISTINCT alertname and NO
      # ``job=`` label, keeping them out of the per-job cron enumerations
      # (ACTIVE_JOBS / staleness-threshold dict / ExecStopPost emit-hook
      # parity). Same Stale/MetricMissing split as the job alerts: only Stale
      # renders a duration (``absent()`` fires with value 1 → a misleading
      # "1s ago" if humanizeDuration were on the missing-metric alert).
      #
      # 259200s = 72h = 0.75× the 96h reader ceiling, so the alert fires ~24h
      # BEFORE the reader starts degrading stamps to "unknown" — giving the
      # operator a day of runway to fix a dead FRED refresher while the cache is
      # still fresh enough to stamp a real regime, rather than paging only after
      # the damage is done. The refresh runs ~6×/day, so 72h = 18 consecutive
      # missed runs — unambiguously a dead refresher, no transient-miss false
      # page. fetched_at is rewritten every successful run (even when FRED has
      # no new observation), so weekends do not age it. ``{series="VIXCLS"}``
      # scopes both rules to the one series we depend on. GAUGE → threshold on
      # ``time() - metric`` / ``absent()``, never increase()/rate() (the
      # AlphalensEdgarNoDispatchTradingDays lesson).
      - alert: AlphalensVixCacheStale
        expr: time() - alphalens_vix_cache_fetched_at_timestamp_seconds{series="VIXCLS"} > 259200
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: vix-cache-refresh
        annotations:
          summary: "VIX regime cache stale > 72h (refreshed ~6x/day)"
          description: "Last VIX cache refresh was {{ $value | humanizeDuration }} ago. Fix before 96h or new feedback decisions start stamping market_regime_at_entry='unknown'. Check the refresh-vix step in `journalctl --user -u alphalens-thematic-build.service` on the VPS (FRED_API_KEY / FRED outage)."

      - alert: AlphalensVixCacheMetricMissing
        expr: absent(alphalens_vix_cache_fetched_at_timestamp_seconds{series="VIXCLS"})
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: vix-cache-refresh
        annotations:
          summary: "VIX regime cache freshness metric missing"
          description: "No VIX cache freshness metric. The refresh-vix step has not succeeded since metrics were enabled, or the textfile collector / node_exporter scrape is broken. New feedback decisions risk stamping market_regime_at_entry='unknown'. Clears after the first successful refresh."

      # ---------------------------------------------------------------
      # Failure — fires on any non-zero exit. Hard fail, immediate
      # debounce (1m so one cron failure does not wait 5m to page).
      # ---------------------------------------------------------------

      # ``for: 5m`` matches the staleness debounce — a one-off
      # SEC EDGAR 503 (5xx is normal background noise) flips
      # ``last_exit_code`` to non-zero for one scrape but the next
      # 15-min retry usually clears it. A 1m debounce would page on
      # that transient; 5m makes us wait for sustained failure.
      # Zen pre-merge review of PR #312 flagged this trade-off.
      - alert: AlphalensJobFailed
        expr: alphalens_job_last_exit_code != 0
        for: 5m
        labels:
          severity: critical
          route: telegram
        annotations:
          summary: "{{ $labels.job }} exited with code {{ $value }}"
          description: "Check `journalctl --user -u alphalens-{{ $labels.job }}.service` on the VPS."

      # ---------------------------------------------------------------
      # Domain alerts — surface "ran clean, found nothing" conditions
      # that an exit-code check would miss.
      # ---------------------------------------------------------------

      # The edgar detector usually finds 1-3 candidates per WEEK on the
      # tiny held + watchlist (~6 tickers). The unique signal here is a
      # genuinely quiet / emptied watchlist — detector LIVENESS is
      # already covered by AlphalensJobStale (30-min staleness) +
      # AlphalensJobMetricMissing, so this rule does not need to watch
      # for "the poller stopped".
      #
      # CALENDAR-AWARE, not a PromQL window. The predecessor
      # (AlphalensEdgarNoCandidates5d) was a blind window
      # ``max_over_time(alphalens_edgar_events_dispatched_total[5d]) == 0``.
      # PromQL cannot consult a holiday calendar, so a [5d] window only
      # TOLERATES weekends statistically and could still false-fire across
      # the December holiday cluster (Christmas + New Year back-to-back) or
      # whenever ``alphalens_edgar_events_dispatched_total`` (a TRANSIENT
      # gauge — nonzero only during the single run that dispatched, reset to
      # 0 the next run) leaves only zeros in the window. The calendar
      # awareness now lives in the EMITTER (Python, where the
      # exchange_calendars holiday table lives): the edgar-detect cron
      # persists the last dispatch date and emits
      # ``alphalens_edgar_trading_days_since_last_dispatch`` on EVERY run
      # (incl. weekends + zero-dispatch runs, so the series never goes
      # absent). The gauge counts XNYS sessions strictly between the last
      # dispatch and today — weekends and holidays never increment it.
      #
      # THRESHOLD = 5 trading days = a full trading week with zero dispatched
      # candidates. Conservative because the dispatch cadence cannot be
      # tightly calibrated (the source gauge is transient + Prometheus
      # retains only ~10d) and this is an info nudge with liveness covered
      # separately — the threshold is a single easy-to-tune literal.
      #
      # GAUGE not counter: ``alphalens_edgar_trading_days_since_last_dispatch``
      # is overwritten with the current value on every emit, so counter
      # functions (``increase()`` / ``rate()``) would return nonsense — a
      # plain threshold is correct (the PR #312 gauge-vs-counter lesson; the
      # calendar window math already happened in the emitter, so no
      # ``max_over_time`` is needed here either).
      #
      # Severity info, NOT warning/critical: a quiet watchlist is a
      # nudge to review portfolio.yaml, not an outage (the broader
      # alert-fatigue discipline shared with the dark rules).
      #
      # ``for: 6h`` matches the sibling AlphalensEdgarPressReleaseDark
      # debounce. The gauge is refreshed every 15-min run, so a single
      # spurious read cannot fire; 6h gives headroom across the boundary
      # where a dispatch arrives just after the threshold is crossed.
      - alert: AlphalensEdgarNoDispatchTradingDays
        expr: alphalens_edgar_trading_days_since_last_dispatch > 5
        for: 6h
        labels:
          severity: info
          route: telegram
        annotations:
          summary: "edgar-detect dispatched 0 candidates in 5+ trading days"
          description: "More than 5 trading days (a full trading week) have elapsed with zero dispatched candidates — calendar-aware, immune to weekends and holidays (the count is XNYS sessions, not clock days). The watched portfolio is tiny, so this usually means an emptied or stale ~/.alphalens/edgar-detect/portfolio.yaml; verify the 'held:' / 'watchlist:' lists are non-empty. A value of 999 is the fail-loud sentinel meaning the dispatch-state file could not be read/written (disk/permission). (Detector liveness is covered separately by AlphalensJobStale.)"

      # AV free-tier quota = 25 calls/day. ``quota_remaining < 3`` flags
      # the operator before the backfill cron silently runs out before
      # a high-value ticker; gives ~3 hours of buffer to react.
      - alert: AlphalensAvQuotaLow
        expr: alphalens_av_quota_remaining < 3
        for: 5m
        labels:
          severity: info
          route: telegram
        annotations:
          summary: "Alpha Vantage quota almost exhausted ({{ $value }} calls left)"
          description: "Quota resets at 00:00 UTC. PEAD-v2 backfill may stall."

      # ---------------------------------------------------------------
      # Thematic output-volume dead-man-switch (test-strategy Phase 4).
      # ---------------------------------------------------------------
      #
      # The L3 golden-replay tests catch a pipeline regression in CI.
      # These rules catch what no hermetic test can: a LIVE LLM model
      # retiring next month (DeepSeek Flash 404 per news item) so a stage
      # produces 0 rows from non-empty input while the run still exits 0
      # — the silent-success-noop class (incident #3, the retired-Gemini
      # empty brief). Each thematic stage emits an input/output gauge pair
      # ``alphalens_thematic_stage_{input,output}_rows{stage="..."}`` from
      # inside the pipeline container (the bind-mounted HOME lands the
      # textfile on the host node_exporter dir).
      #
      # Gauge-correct aggregation: the stage gauges are OVERWRITTEN each
      # run, so increase()/rate() return nonsense (the
      # AlphalensEdgarPressReleaseDark lesson, PR #312). The right operator
      # for "produced nothing across every run in the window" is
      # ``max_over_time``. After max_over_time strips ``__name__``, the
      # input and output vectors share only ``{stage}`` so the ``and``
      # matches per-stage — which is exactly why the gauges are
      # co-located on the same stage label rather than inferred across a
      # cross-series join.
      #
      # ``for: 1h`` debounce — one quiet fire (a stage legitimately empty
      # for a single 4-hourly run) must not page; a stage that is empty
      # across the whole 24h window despite non-empty input is the signal.
      - alert: AlphalensThematicStageZeroOutput
        expr: |
          max_over_time(alphalens_thematic_stage_output_rows[24h]) == 0
          and
          max_over_time(alphalens_thematic_stage_input_rows[24h]) > 0
        for: 1h
        labels:
          severity: critical
          route: telegram
          unit: thematic-build
        annotations:
          summary: "thematic stage {{ $labels.stage }} produced 0 rows from non-empty input (24h)"
          description: "Silent-success noop: input present, output empty across every run in 24h. Likely an LLM model retirement / API contract break. Check `journalctl --user -u alphalens-thematic-build.service` on the VPS."

      # Partial-degradation catch: today's brief output collapsed to <34%
      # (~3x drop) of its own 7-day median. Distinct from the zero-output
      # rule — catches a quota throttle / partial model failure that still
      # produces *some* briefs. The ``>= 3`` median guard suppresses
      # cold-start false pages until a real baseline accrues (the series
      # is brand-new, so it stays quiet ~7 days). Thresholds are
      # first-guess; tune after 2-3 weeks of real baseline. Brief-only:
      # the user-visible terminal output; per-stage anomaly would add
      # cold-start noise for little gain.
      - alert: AlphalensThematicBriefVolumeAnomaly
        expr: |
          alphalens_thematic_stage_output_rows{stage="brief"}
          <
          0.34 * quantile_over_time(0.5, alphalens_thematic_stage_output_rows{stage="brief"}[7d] offset 1h)
          and
          quantile_over_time(0.5, alphalens_thematic_stage_output_rows{stage="brief"}[7d] offset 1h) >= 3
        for: 6h
        labels:
          severity: warning
          route: telegram
          unit: thematic-build
        annotations:
          summary: "thematic brief volume {{ $value }} is <34% of 7-day median"
          description: "Brief output collapsed vs baseline (not zero). Possible partial LLM / quota degradation. Check the daily thematic-build logs."

      # Honest-flag degradation: too many of the day's briefs carry
      # ``brief_status="unavailable"`` (text generation terminally
      # failed; the row still ships so the parquet stays honest).
      # Numerator and denominator come from the SAME thematic-build
      # emit (``briefs_total`` == the brief row count), so the ratio
      # is always same-run consistent and label-compatible — no
      # vector-matching gymnastics against the stage-labelled series.
      # ``>= 3`` volume guard mirrors the sibling rule above: a 1-2
      # brief day tripping on a single failure is noise, not signal.
      # ``for: 6h`` = sustained across at least two 4-hourly slots;
      # a one-slot LLM hiccup that the next slot's rerun heals must
      # not page. Prometheus-only by user decision — the CLI emits no
      # Telegram for this condition.
      # NOTE: live rules on the VPS are hand-synced (not repo-mounted)
      # — copy this file over and HUP prometheus after editing.
      - alert: AlphalensThematicBriefUnavailableHigh
        expr: |
          alphalens_thematic_brief_unavailable_count
          >
          0.33 * alphalens_thematic_briefs_total
          and
          alphalens_thematic_briefs_total >= 3
          and
          alphalens_thematic_brief_unavailable_count >= 2
        for: 6h
        labels:
          severity: warning
          route: telegram
          unit: thematic-build
        annotations:
          summary: "{{ $value }} thematic briefs are brief_status=unavailable (>1/3 of the day)"
          description: "A sustained large fraction of today's briefs shipped without text. TWO causes now feed this counter: a terminal generation failure (LLM model retirement / quota exhaustion surviving the retry ladder), and a support-guard withhold (the prose asserted a benefit the evidence record does not carry, so the pipeline suppressed text it had already generated). Split them with alphalens_thematic_brief_support_guard_withheld_total before treating this as an LLM outage. Check the daily thematic-build logs."

      # Stage-B channel assessor outage. The whole reason
      # ``channel_assess_failed`` is split from ``channel_not_established`` is
      # that an OUTAGE and a quiet news day must not look alike: a failed
      # assessment carries the bottom support level by construction, and a
      # sustained OpenRouter
      # 429 window would otherwise produce a plausible-looking all-refuse day
      # that nothing pages on — and those rows then enter a pre-registered
      # forward accrual (docs/research/channel_feature_forward_prereg_2026_08_19.md).
      # The denominator is the whole assessed population from the same emit, so
      # the ratio is same-run consistent. ``>= 5`` volume guard keeps a 1-2
      # candidate day from tripping on a single failure; ``for: 6h`` means the
      # condition survived at least two 4-hourly slots, so a one-slot hiccup the
      # next rerun heals does not page.
      # NOTE: live rules on the VPS are hand-synced (not repo-mounted)
      # — copy this file over and HUP prometheus after editing.
      - alert: AlphalensThematicChannelAssessFailureHigh
        expr: |
          alphalens_thematic_channel_assess_failed_total
          >
          0.33 * (
            alphalens_thematic_channel_established_total
            + alphalens_thematic_channel_suggestive_total
            + alphalens_thematic_channel_not_established_total
            + alphalens_thematic_channel_assess_failed_total
          )
          and
          (
            alphalens_thematic_channel_established_total
            + alphalens_thematic_channel_suggestive_total
            + alphalens_thematic_channel_not_established_total
            + alphalens_thematic_channel_assess_failed_total
          ) >= 5
        for: 6h
        labels:
          severity: warning
          route: telegram
          unit: thematic-build
        annotations:
          summary: "{{ $value }} channel assessments failed (>1/3 of the day's assessed candidates)"
          description: "Stage-B assessor outage, not a channel-less day. The shadow verdict reads refuse for these themes and the rows still ship, so nothing else surfaces it. Check OpenRouter quota / 429s in `journalctl --user -u alphalens-thematic-build.service` on the VPS."

      # Companion MetricMissing: the six channel gauges are emitted on EVERY
      # run including a frozen reuse (all zeros), so their absence means the
      # emit path broke or the exporter stopped — not a quiet day. Only the
      # denominator's first term is checked; the six are emitted together.
      - alert: AlphalensThematicChannelGaugesMissing
        expr: absent(alphalens_thematic_channel_established_total)
        for: 12h
        labels:
          severity: warning
          route: telegram
          unit: thematic-build
        annotations:
          summary: "thematic channel gauges missing"
          description: "No alphalens_thematic_channel_* series. Either map-themes has not run since the channel-assessment increment deployed, or the textfile collector / node_exporter scrape is broken. Clears after the first map-themes run on the new image."

      # Output-QUALITY degradation (the volume rules above cannot see it).
      # 2026-07-25/26 shipped a volume-NORMAL day whose briefs were
      # internally empty: every ``brief_trade_setup`` came back
      # status=NO_STRUCTURE with zero entry tiers, so each card had no
      # ladder to act on (#917, a universe-wide NaN close from the price
      # source). Nothing in the volume family moved, so nothing paged and
      # the user found it days later. The point is not this one root
      # cause — it is that the next UNKNOWN cause of the same symptom has
      # to be caught by the system.
      #
      # SCOPE — this rule covers the volume-normal shape ONLY. The other
      # July regression (#910, a NaN market_cap surviving an
      # `is not None` check) collapsed the day's briefs to ZERO, not to
      # empty ladders; the ``briefs_total >= 3`` guard below makes this
      # rule structurally unable to fire on that shape, and it must not
      # try — AlphalensThematicStageZeroOutput and
      # AlphalensThematicBriefVolumeAnomaly already own it. Do not
      # "extend" this rule to cover zero-volume days; that only
      # duplicates a page.
      #
      # Threshold is ABSOLUTE, not baseline-relative like the sibling
      # AlphalensThematicBriefVolumeAnomaly, for two reasons: the failure
      # signature is a hard 0.0 (not a soft dip), and an absolute floor
      # has no cold-start blind window on a brand-new series.
      #
      # Measured base rate over all 64 days in ~/.alphalens/thematic_briefs/
      # that carry the column (2026-05-27 .. 2026-07-29): ratio == 1.0 on
      # 62 days, mean 0.9968; the only two exceptions are 0.9524
      # (2026-05-27, 20/21) and 0.8421 (2026-05-28, 16/19), both
      # single-name yfinance gaps, not systemic. Historical firing count
      # at < 0.5 is ZERO across those 64 days.
      #
      # The two incident days are NOT in that sample as incidents: both
      # 2026-07-25 and 2026-07-26 were regenerated after the #917 fix
      # merged (parquet mtime 2026-07-27) and now read 1.0 (9/9, 14/14),
      # so no 0.0 day survives on disk to measure. The must-fire claim is
      # therefore STRUCTURAL, not measured: #917's own commit body records
      # that the NaN close "degraded every candidate to
      # NO_STRUCTURE(asof_close=0.0, atr=0.0)" — a whole-day ratio of 0.0
      # against n=9 / n=14, which clears every clause below.
      #
      # Guards. The benign per-name failure has the SAME row signature as
      # the incident (EXPO/SAIC/ADT on 2026-05-27/28: NO_STRUCTURE,
      # close=0.0, atr=0.0) — only the COUNT separates them, so a
      # ratio-only rule is denominator-sensitive. Observed benign worst
      # case is 3 bad names in a day; the n distribution has a long left
      # tail (min 3, three days at n=3, five days at n<=5, median 12), so
      # replaying that same 3-name gap on an n=3 or n=5 day would trip a
      # ratio-only rule (5 of the 64 historical day shapes). Hence three
      # clauses, mirroring AlphalensThematicBriefUnavailableHigh:
      #   * ratio < 0.5      — the degradation itself.
      #   * briefs_total >= 3 — a 1-2 brief day is noise.
      #   * unusable >= 4     — one above the worst benign count, so no
      #     observed benign pattern fires at ANY n. Costs only the n=3
      #     total-collapse shape; the incident class is systemic and
      #     multi-day (2026-07-24..26), so it re-pages on the next day
      #     above n=3.
      # ``for: 6h`` = sustained across at least two of the 4-hourly slots
      # (one bad slot holds its textfile value ~4h, under the window).
      # Note this debounce does NOT discriminate benign from malign here:
      # the poisoned yfinance frame is CACHED, so a real incident persists
      # across slots just as a missing-history name does. The separation
      # is carried entirely by the three clauses above.
      # Numerator and denominator come from the SAME thematic-build emit,
      # so the ratio is same-run consistent and label-compatible.
      # NOTE: live rules on the VPS are hand-synced (not repo-mounted)
      # — copy this file over and HUP prometheus after editing.
      - alert: AlphalensThematicBriefLadderUsableLow
        expr: |
          alphalens_thematic_brief_usable_ladder_ratio < 0.5
          and
          alphalens_thematic_briefs_total >= 3
          and
          (alphalens_thematic_briefs_total - alphalens_thematic_brief_usable_ladder_total) >= 4
        for: 6h
        labels:
          severity: warning
          route: telegram
          unit: thematic-build
        annotations:
          summary: "only {{ $value | humanizePercentage }} of today's thematic briefs carry a usable entry ladder"
          description: "Briefs shipped in normal volume but most have brief_trade_setup status=NO_STRUCTURE / zero entry tiers, so the cards are not actionable. Past causes were non-finite market_cap and non-finite close prices reaching the setup builder. Check alphalens_thematic_score_core_numerics_finite_ratio first (it localises the failure to the score stage), then the daily thematic-build logs."

      # The threshold rule above can only fire on a series that EXISTS. If
      # the brief-stage emit is ever dropped — broken textfile collector,
      # a refactor that loses the splice, a rename — the quality gauge
      # vanishes and the alert goes silently dead. That is the same
      # silent-disarm failure this whole family exists to catch, so the
      # gauge gets the absent() partner the form4 / edgar / vix gauges
      # already carry. Expected to fire once on a fresh deploy (the
      # pipeline image must ship the new emit first); clears on the first
      # thematic-build run that emits it.
      - alert: AlphalensThematicBriefLadderUsableMetricMissing
        expr: absent(alphalens_thematic_brief_usable_ladder_ratio)
        for: 1h
        labels:
          severity: warning
          route: telegram
          unit: thematic-build
        annotations:
          summary: "thematic brief ladder-quality gauge missing"
          description: "No alphalens_thematic_brief_usable_ladder_ratio series. The brief stage's emit has not succeeded since the gauge shipped, or the textfile collector / node_exporter scrape is broken — either way AlphalensThematicBriefLadderUsableLow is disarmed. Expected once on a fresh deploy; clears after the first thematic-build run carrying the gauge."

      # The day's theme rollup is written EXACTLY ONCE per asof — by the slot
      # that really re-derived the slate — and the write is best-effort, so a
      # failure is logged and swallowed rather than costing the day's briefs.
      # Those two together mean one failed write erases the day from the store
      # for good: a later slot cannot redo it (the propensities need the
      # deciding slot's event counts, and the growing events parquet has
      # already overwritten them). The one-hot
      # ``alphalens_thematic_theme_rollup_write{outcome=...}`` gauge is what
      # makes that hole countable instead of merely absent; this rule is what
      # watches it.
      #
      # Both sides are read over a RANGE, never as an instant vector: the six
      # daily slots overwrite the same textfile, so an instant read returns
      # whichever slot fired last. In steady state the deciding slot publishes
      # written=1 for its ~4h holding period each day, so
      # ``max_over_time(written[24h])`` is 1 and the rule stays silent; a day
      # whose deciding slot failed leaves failed=1 and no written sample at all,
      # and the rule arms once yesterday's written sample ages out of the window.
      #
      # ``ignoring(outcome)`` is load-bearing. ``and`` matches on the FULL label
      # set, and the two sides carry different ``outcome`` values, so a bare
      # ``and`` would never match — the rule would sit green forever and the
      # gauge would go unwatched, which is the condition it exists to end.
      #
      # ``for: 6h`` = the condition survived at least one further 4-hourly slot,
      # so a deciding slot that failed and was re-derived by the next one (its
      # candidate set having been degraded / empty) does not page.
      # NOTE: live rules on the VPS are hand-synced (not repo-mounted)
      # — copy this file over and HUP prometheus after editing.
      - alert: AlphalensThematicThemeRollupLost
        expr: |
          (max_over_time(alphalens_thematic_theme_rollup_write{outcome="failed"}[24h]) > 0)
          and ignoring(outcome)
          (max_over_time(alphalens_thematic_theme_rollup_write{outcome="written"}[24h]) == 0)
        for: 6h
        labels:
          severity: warning
          route: telegram
          unit: thematic-build
        annotations:
          summary: "the theme rollup for today's asof failed to write and no slot wrote one"
          description: "map-themes swallowed the rollup write (telemetry must never cost the briefs), and no later slot wrote one either — the day's theme ranking and its selection propensities are gone, so that asof cannot enter an off-policy evaluation. A rerun cannot recover it: the propensities need the deciding slot's event counts and the events parquet has grown since. Check `journalctl --user -u alphalens-thematic-build.service` on the VPS for the swallowed exception (disk full / permissions are the usual causes)."

      # Companion to the rule above, for the state its emitter degrades to. An
      # outcome literal the emitter does not recognise is published as
      # ``outcome="unknown"`` rather than raised — raising would kill map-themes
      # AFTER the candidate parquet is written, and under run_thematic_day.sh's
      # ``set -e`` that aborts score, brief and rebuild-cache for the whole day.
      # A telemetry typo must not cost the briefs. The rule above cannot see
      # this state (the write itself may well have succeeded), so the degraded
      # state gets its own rule; a static test pins that no code path passes an
      # unrecognised literal, so this firing means a real code defect shipped.
      - alert: AlphalensThematicThemeRollupOutcomeUnknown
        expr: |
          max_over_time(alphalens_thematic_theme_rollup_write{outcome="unknown"}[24h]) > 0
        for: 6h
        labels:
          severity: warning
          route: telegram
          unit: thematic-build
        annotations:
          summary: "map-themes published an unrecognised theme-rollup write outcome"
          description: "The rollup-write gauge fell back to outcome=unknown, which no code path is supposed to reach — an outcome literal drifted out of THEME_ROLLUP_WRITE_OUTCOMES in alphalens_cli/commands/thematic.py. The stage still completed and the briefs are unaffected, but AlphalensThematicThemeRollupLost is blind for as long as this lasts: it can no longer tell a written day from a failed one."

      # ---------------------------------------------------------------
      # Structured-event-template health (epic #321 PR-1).
      # ---------------------------------------------------------------
      #
      # ``AlphalensTemplateMatchRateLow`` fires when a SPECIFIC template
      # drops below 20% match-rate over a rolling 7-day window. The
      # aggregate template_match_rate across all 5 dnia-jeden templates
      # is expected to sit in the 20-35% range for the first months
      # (design memo §1.1) — alerting on aggregate would be noisy.
      # Per-template lets the operator catch pattern rot in one template
      # without burning attention on the expected steady-state aggregate.
      #
      # ``for: 1d`` debounce — a single quiet news day on a niche
      # template (e.g. regulatory_action when there's no FDA panel that
      # week) should not page; sustained drift is the signal.
      #
      # Guard against judging the match rate on too few attempts. A
      # brand-new or low-traffic template (e.g. 1 attempt / 0 match over
      # the window) would otherwise trip a 7-day low-match-rate page on
      # statistically meaningless volume. Require an absolute minimum of
      # 50 attempts over the 7-day window before the rate clause counts;
      # ``increase()`` gives the total count (not the per-second rate, so
      # a single attempt no longer satisfies the old ``rate(...) > 0``
      # guard). This also keeps the zero-denominator division safe — no
      # series is produced until the min-sample clause passes.
      - alert: AlphalensTemplateMatchRateLow
        expr: |
          (sum by (template_id) (rate(alphalens_template_match_total[7d]))
           /
           sum by (template_id) (rate(alphalens_template_attempt_total[7d])))
          < 0.20
          and
          sum by (template_id) (increase(alphalens_template_attempt_total[7d])) >= 50
        for: 1d
        labels:
          severity: warning
          route: telegram
        annotations:
          summary: "Template {{ $labels.template_id }} match rate < 20% for 7 days"
          description: "Per-template match-rate sustained below 20% — review pattern in templates/{{ $labels.template_id }}.yaml or accept drift via `alphalens templates evaluate`."

      # ---------------------------------------------------------------
      # EDGAR EX-99.1 press-release dead-man-switch (epic #379 / #384).
      # ---------------------------------------------------------------
      #
      # The SEC EX-99.1 daily-index ingest (#332) went dark for ~6
      # consecutive days under concurrent per-IP 403 load (edgar-detect +
      # thematic-build + companyfacts burst > 10 req/s); the 403 was not
      # retried and ``_safe_call`` swallowed the empty frame -> 0
      # edgar_press_release rows -> 0 template matches -> empty
      # brief_template_id. PR #386 fixed the CAUSE (cross-process rate
      # coordinator); this is the BACKSTOP. The ingest STAGE gauge cannot
      # catch it: the lexical-cluster representative is chosen timestamp-
      # first, so a non-earliest edgar row loses its source label, and the
      # cap drops rows -> the post-dedup count is not edgar-specific. The
      # CLI emits the RAW pre-dedup per-source count
      # (``alphalens_thematic_source_rows{source=...}``), written
      # UNCONDITIONALLY (edgar=0 on a swallowed 403 IS the signal), so this
      # rule can alert on edgar going dark.
      #
      # No single-shot / hermetic / L4-live-probe test can catch a
      # LOAD-dependent 403 (the probe tests ONE fetch in isolation = the
      # always-worked manual case). This rule also catches the #383
      # partial-frame-cache trade-off (a 1-survivor 403 day caches + short-
      # circuits).
      #
      # WINDOW = 5d, NOT 4d. ``max_over_time(...[Nd]) == 0`` fires the
      # instant the trailing window holds only zeros, so to TOLERATE an
      # N-zero-day cluster the window must be STRICTLY LONGER than the
      # cluster. The worst legitimate all-zero run is the pessimistic
      # Thanksgiving cluster (Thu closed + Fri thin + Sat + Sun = 4 zero-
      # days). 5d = worst-legit (4d) + 1 tolerates it; the 6-day 403
      # starvation still trips a 5d window on ~day 5 + the for:6h debounce,
      # ~1 day of headroom. thematic-build is NOT trading-day-gated
      # (OnCalendar HH:30 UTC every day), so weekend runs overwrite the
      # gauge with fresh samples — this window analysis holds ONLY while the
      # timer stays non-gated. If a future PR adds
      # ExecCondition=is-trading-day the weekend gauge goes stale and this
      # window must be re-derived.
      #
      # GAUGE (overwritten each run) -> max_over_time, never
      # increase()/rate() (the PR #312 lesson). DISTINCT alertname + NO
      # ``job=`` label (like the VIX-cache rules) keeps it out of the
      # per-job cron enumerations. Severity warning, not critical: a
      # degraded data source is not a wake-up outage (over-escalation breeds
      # alert fatigue — the AlphalensEdgarNoDispatchTradingDays precedent).
      - alert: AlphalensEdgarPressReleaseDark
        expr: max_over_time(alphalens_thematic_source_rows{source="edgar_press_release"}[5d]) == 0
        for: 6h
        labels:
          severity: warning
          route: telegram
          unit: thematic-build
        annotations:
          summary: "EDGAR EX-99.1 press-release ingest produced 0 rows for 5 days"
          description: "The edgar_press_release source has been dark across every thematic-build run for the last 5 days — longer than any normal weekend or the worst holiday cluster (Thanksgiving). Likely a per-IP SEC 403 starvation under concurrent load (epic #379) that _safe_call swallowed: empty press-release rows -> 0 template matches -> empty brief_template_id. Check the ingest step in `journalctl --user -u alphalens-thematic-build.service` and the SEC daily-index fetch / sec_rate_coord.lock. The aggregate ingest stage gauge will NOT show this; it undercounts edgar after dedup/cap."

      # absent() companion for the cold-start / emit-step-broken blind spot.
      # During a real 403 starvation the series is PRESENT at 0 (the Dark
      # rule's job), so this only fires when the source-volume emit step
      # itself never landed since metrics were enabled (fresh deploy, or a
      # broken textfile collector / node_exporter scrape). Clears on the
      # first successful ingest.
      - alert: AlphalensEdgarPressReleaseMetricMissing
        expr: absent(alphalens_thematic_source_rows{source="edgar_press_release"})
        for: 1h
        labels:
          severity: warning
          route: telegram
          unit: thematic-build
        annotations:
          summary: "EDGAR press-release source-volume metric missing"
          description: "No alphalens_thematic_source_rows{source=edgar_press_release} series. The ingest source-volume emit step has not succeeded since metrics were enabled, or the textfile collector / node_exporter scrape is broken. Expected once on a fresh deploy; clears after the first successful `alphalens thematic ingest` run."

      # ---------------------------------------------------------------
      # Form-4 daily-incremental output-volume dead-man-switch.
      # ---------------------------------------------------------------
      #
      # The job's AlphalensJobStale rule above catches "stopped running", but a
      # run that exits 0 and writes 0 rows for days (silent-success-noop) is
      # invisible to the exit-code check: a daily-index format drift degrades to
      # "0 rows + transient" rather than a crash, and a persistent per-IP 403
      # starvation produces the same 0-row clean exit. This rule is the backstop:
      # alert when the rows-written gauge (emitted every run by the runner) stays
      # 0 across the window.
      #
      # GAUGE (overwritten each run) -> max_over_time, never increase()/rate()
      # (the PR #312 lesson). DISTINCT alertname + NO ``job=`` label (like the
      # VIX-cache + EDGAR-dark rules) keep it out of the per-job cron
      # enumerations. 5d window, NOT 4d: max_over_time(...[5d]) == 0 tolerates the
      # worst legitimate all-zero cluster (a holiday + weekend with no new Form-4
      # filings). Severity warning, not critical: a degraded data source is not a
      # wake-up outage (the AlphalensEdgarNoDispatchTradingDays precedent).
      - alert: AlphalensForm4IncrementalDark
        expr: max_over_time(alphalens_form4_rows_written[5d]) == 0
        for: 6h
        labels:
          severity: warning
          route: telegram
          unit: form4-incremental
        annotations:
          summary: "Form-4 daily-incremental ingest wrote 0 rows for 5 days"
          description: "alphalens_form4_rows_written has been 0 across every form4-incremental run for the last 5 days — longer than any normal weekend or the worst holiday cluster. Likely a per-IP SEC 403 starvation under concurrent load or a daily-index format drift that degrades to 0 rows + transient. Check `journalctl --user -u alphalens-form4-incremental.service` and the SEC daily-index fetch / sec_rate_coord.lock. The job's AlphalensJobStale rule will NOT show this — the run still exits 0."

      # absent() companion for the cold-start / emit-step-broken blind spot.
      # During a real 0-row run the series is PRESENT at 0 (the Dark rule's job),
      # so this only fires when the runner's emit step never landed since metrics
      # were enabled (fresh deploy, or a broken textfile collector / scrape).
      # Clears on the first successful run.
      - alert: AlphalensForm4IncrementalMetricMissing
        expr: absent(alphalens_form4_rows_written)
        for: 1h
        labels:
          severity: warning
          route: telegram
          unit: form4-incremental
        annotations:
          summary: "Form-4 daily-incremental rows-written metric missing"
          description: "No alphalens_form4_rows_written series. The runner's emit step has not succeeded since metrics were enabled, or the textfile collector / node_exporter scrape is broken. Expected once on a fresh deploy; clears after the first successful run_form4_daily_incremental.py run."

      # Chronic SEC-fetch failure the Dark/Stale rules MISS: rows_written can
      # stay non-zero (other dates succeed) while one source keeps failing, so a
      # SUSTAINED transient-error count is the only signal. The gauge holds its
      # last emit between daily runs; min_over_time(...[50h]) > 0 means BOTH of
      # the last two nightly runs reported errors — a single clean run emits 0
      # and clears it, so a self-healing one-off does not fire. DISTINCT
      # alertname + NO job= label keep it out of the cron-keyed enums.
      - alert: AlphalensForm4IncrementalTransientErrors
        expr: min_over_time(alphalens_form4_transient_errors[50h]) > 0
        for: 1h
        labels:
          severity: warning
          route: telegram
          unit: form4-incremental
        annotations:
          summary: "Form-4 daily-incremental hit SEC fetch errors on consecutive runs"
          description: "alphalens_form4_transient_errors stayed > 0 across the last two nightly form4-incremental runs (a clean run emits 0 and clears this). A persistent SEC daily-index / submissions / XML 403 or transient failure is dropping some dates' filings while rows_written may remain non-zero from other dates — so AlphalensForm4IncrementalDark and AlphalensJobStale will NOT surface it. Check `journalctl --user -u alphalens-form4-incremental.service` and the SEC rate coordinator / per-IP 403 load."

      # Implausible-move guard fail-closed arm going chronic (#1090 memo §4).
      # A lookup_failed disposition means the guard tripped on a >60% move but
      # could NOT reach the corporate-actions reference, so it carried the row
      # — i.e. the pre-#1090 blindness, silently back: /edge quietly loses its
      # largest movers again while the nightly run still exits 0, so
      # AlphalensJobStale will NOT surface it. GAUGE not counter (the textfile
      # emitter overwrites the per-run value; the _total suffix follows the
      # existing edgar/thematic naming): min_over_time(...[50h]) > 0 means
      # BOTH of the last two nightly 06:30 UTC runs reported lookup failures —
      # a single clean run emits 0 and clears it, so a one-off Polygon blip
      # does not fire. DISTINCT alertname + NO job= label keep it out of the
      # cron-keyed enums (the form4-transient-errors precedent).
      - alert: AlphalensFeedbackGuardLookupFailed
        expr: min_over_time(alphalens_feedback_guard_total{disposition="lookup_failed"}[50h]) > 0
        for: 1h
        labels:
          severity: warning
          route: telegram
          unit: feedback-shadow-returns
        annotations:
          summary: "Implausible-move guard corporate-actions lookups failing on consecutive runs"
          description: "alphalens_feedback_guard_total{disposition=\"lookup_failed\"} stayed > 0 across the last two nightly feedback-shadow-returns runs — the guard is carrying >60% movers unresolved instead of classifying them (the fail-closed arm has reverted to the pre-#1090 blindness). Check `journalctl --user -u alphalens-feedback-shadow-returns.service` for the Polygon reference-endpoint errors. Note: this rules file is the repo SoT; the alphalens-prometheus-rules-sync timer converges the live VPS copy hourly (manual copy over + `docker exec prometheus kill -HUP 1` is an emergency override only)."

      # Companion absence guard for the rule above: the guard gauge is
      # (re)written by every successful nightly run, so a missing series means
      # the emit path broke or the textfile scrape is dark — states in which
      # AlphalensFeedbackGuardLookupFailed is silently DISARMED while the job
      # itself still exits 0 (AlphalensJobStale stays quiet). Same discipline
      # as the AlphalensJobMetricMissing family.
      - alert: AlphalensFeedbackGuardGaugeMissing
        expr: absent(alphalens_feedback_guard_total{disposition="lookup_failed"})
        for: 1h
        labels:
          severity: warning
          route: telegram
          unit: feedback-shadow-returns
        annotations:
          summary: "implausible-move guard disposition gauge missing"
          description: "No alphalens_feedback_guard_total series is being scraped: either the guard-metric emit has not succeeded since deploy, or the textfile collector / node_exporter scrape is broken — AlphalensFeedbackGuardLookupFailed is disarmed while this fires. Clears after the first successful nightly emit. Note: this rules file is the repo SoT; the alphalens-prometheus-rules-sync timer converges the live VPS copy hourly (manual copy over + `docker exec prometheus kill -HUP 1` is an emergency override only)."

      # broker-manager is a Type=simple daemon: ExecStopPost fires only on
      # crash/restart, so health = the per-tick heartbeat gauge the control loop
      # writes each ~45s tick. 300s = 5min ~ 6-7 missed ticks.
      - alert: AlphalensBrokerManagerHeartbeatStale
        expr: time() - alphalens_broker_manager_last_tick_timestamp_seconds{job="broker-manager-sim"} > 300
        for: 2m
        labels:
          severity: warning
          route: telegram
          unit: broker-manager
        annotations:
          summary: "broker-manager heartbeat stale > 5m (expected ~45s ticks)"
          description: "Last control-loop tick was {{ $value | humanizeDuration }} ago — the SIM auto-manager may be wedged or stopped."

      - alert: AlphalensBrokerManagerHeartbeatMissing
        expr: absent(alphalens_broker_manager_last_tick_timestamp_seconds{job="broker-manager-sim"})
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: broker-manager
        annotations:
          summary: "broker-manager heartbeat metric missing"
          description: "No heartbeat gauge for broker-manager. The daemon has not ticked since metrics were enabled, or the textfile collector / node_exporter scrape is broken. Clears after the first tick."

      # --- SIM order/position stream breaker (rearm design memo §4.6) -------
      # Telegram gets EDGES (the daemon's episode latch pages one OPEN and one
      # delivery-confirmed CLOSE); Prometheus owns every LEVEL below. Every
      # rule carries the daemon-freshness guard (time() - last_tick < 300):
      # emit_domain_metrics never unlinks, so a stopped SIM unit leaves
      # node_exporter re-serving a frozen breaker_open=1 forever — the guard
      # goes false as the heartbeat freezes and
      # AlphalensBrokerManagerHeartbeatStale fires instead, which is the
      # correct alert for "the daemon stopped".
      - alert: AlphalensBrokerStreamBreakerOpen
        # for: 20m exceeds the first four re-arm ladder rungs
        # (60+120+240+480 = 900s) plus one 300s delivery dwell, so a blip
        # healed within four trials never reaches Alertmanager. Safe to choose
        # freely because breaker_open is EPISODE-scoped and does not flicker
        # per trial.
        expr: >-
          alphalens_broker_manager_stream_breaker_open{job="broker-manager-sim"} == 1
          and (time() - alphalens_broker_manager_last_tick_timestamp_seconds{job="broker-manager-sim"}) < 300
        for: 20m
        labels:
          severity: warning
          route: telegram
          unit: broker-manager
        annotations:
          summary: "SIM order-stream breaker episode open > 20m (re-arm ladder not converging)"
          description: "The Saxo SIM order/position stream has stayed dark across at least four re-arm trials plus a delivery dwell — likely a sustained Saxo outage. Protection is unaffected (the ~45s poll backstop covers every tick); the cost is wake latency. Check `journalctl --user -u alphalens-broker-manager.service` for the trial failures and run `alphalens broker stream-status` for the gauge snapshot. Note: this rules file is the repo SoT; the alphalens-prometheus-rules-sync timer converges the live VPS copy hourly (manual copy over + `docker exec prometheus kill -HUP 1` is an emergency override only)."

      - alert: AlphalensBrokerStreamStale
        # Dark-but-CONNECTED: the reader claims to be up but no frame has
        # arrived for >300s (the LivePriceStreamStale shape on the order
        # stream). Suppressed while a breaker episode is open — that state is
        # already reported by its own pages and the BreakerOpen rule. `unless`
        # (NOT `and == 0`) so an ABSENT breaker gauge (live rules are
        # hand-synced and may lead the daemon) leaves the alert exactly as
        # before.
        expr: >-
          alphalens_broker_manager_stream_last_message_age_seconds{job="broker-manager-sim"} > 300
          and alphalens_broker_manager_stream_reader_up{job="broker-manager-sim"} == 1
          and (time() - alphalens_broker_manager_last_tick_timestamp_seconds{job="broker-manager-sim"}) < 300
          unless alphalens_broker_manager_stream_breaker_open{job="broker-manager-sim"} == 1
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: broker-manager
        annotations:
          summary: "SIM order-stream silent > 5m while the reader claims up"
          description: "The stream reader reports up but no frame has arrived for over 5 minutes — the dark-but-connected case (recv timeout + resubscribe should self-heal; sustained staleness means they are not). Early wake degrades to the ~45s poll; protection is unaffected. Check `journalctl --user -u alphalens-broker-manager.service`. Note: this rules file is the repo SoT; the alphalens-prometheus-rules-sync timer converges the live VPS copy hourly (manual copy over + `docker exec prometheus kill -HUP 1` is an emergency override only)."

      - alert: AlphalensBrokerStreamFlapping
        # increase() is correct here: trips_total is the one genuinely
        # monotonic counter in the stream family (it survives tick gaps by
        # design). >3 trips/hour means the ladder is cycling
        # trip/re-arm/re-trip instead of converging; the daemon has already
        # sent its single CRITICAL flap page and latched OPEN pages off.
        expr: >-
          increase(alphalens_broker_manager_stream_trips_total{job="broker-manager-sim"}[1h]) > 3
          and (time() - alphalens_broker_manager_last_tick_timestamp_seconds{job="broker-manager-sim"}) < 300
        for: 10m
        labels:
          severity: warning
          route: telegram
          unit: broker-manager
        annotations:
          summary: "SIM order-stream breaker flapping (>3 trips/hour)"
          description: "More than 3 breaker trips inside an hour — the stream connects and dies repeatedly, so the re-arm ladder is cycling instead of converging (a gateway that accepts sockets and then drops them, or a Saxo-side incident). Check `journalctl --user -u alphalens-broker-manager.service` for the trip reasons. Note: this rules file is the repo SoT; the alphalens-prometheus-rules-sync timer converges the live VPS copy hourly (manual copy over + `docker exec prometheus kill -HUP 1` is an emergency override only)."

      - alert: AlphalensLivePriceStreamReaderDown
        # Gated on subscribed_uics > 0: an idle reader (nothing subscribed)
        # holds no WebSocket BY DESIGN and must not page. reader_up=0 while
        # uics are subscribed = the circuit breaker tripped (or the reader
        # crashed) with live-market exits depending on the feed.
        expr: >-
          alphalens_live_price_stream_reader_up{job="live-price-stream-sim"} == 0
          and alphalens_live_price_stream_subscribed_uics{job="live-price-stream-sim"} > 0
        for: 10m
        labels:
          severity: warning
          route: telegram
          unit: broker-manager
        annotations:
          summary: "LIVE price stream reader down while uics are subscribed"
          description: "The Saxo LIVE price feed reader is not running but positions still want live prices — trailing/live exits are dark (protection pass unaffected). The daemon rebuilds the reader on demand; sustained reader_up=0 means the rebuild loop itself is failing."

      - alert: AlphalensLivePriceStreamStale
        # No frame for 5m while subscribed and the reader claims to be up:
        # the dark-but-connected case observability exists to catch.
        #
        # The session gate (ALPHALENS_SAXO_STREAM_SESSION_GATE) intentionally
        # holds no WebSocket overnight, freezing last_frame at ~close with
        # reader_up=1 and subscribed_uics>0 — the exact signature above. The
        # stream flips session_asleep on each sleep/wake edge; drop that
        # state via `unless == 1`. `unless` (NOT `and == 0`) so an ABSENT
        # gauge (older stream code / gate never wired; live rules are
        # hand-synced and may lead the daemon) leaves the alert exactly as
        # before. Residual: a predicate wrongly returning False DURING a
        # session silences the stream and this alert together — that mode is
        # pinned by the window-math unit tests, and a RAISING predicate
        # fails open stream-side (treated as in-session).
        expr: >-
          (time() - alphalens_live_price_stream_last_frame_timestamp_seconds{job="live-price-stream-sim"}) > 300
          and alphalens_live_price_stream_subscribed_uics{job="live-price-stream-sim"} > 0
          and alphalens_live_price_stream_reader_up{job="live-price-stream-sim"} == 1
          unless alphalens_live_price_stream_session_asleep{job="live-price-stream-sim"} == 1
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: broker-manager
        annotations:
          summary: "LIVE price stream silent > 5m with subscriptions active"
          description: "The reader is up and uics are subscribed but no frame has arrived for {{ $value | humanizeDuration }} — the feed is dark-but-connected. Recv timeout + resubscribe should self-heal; sustained staleness means they are not."

      # saxo-refresh is a timer-driven oneshot (~20min keep-alive), so the
      # standard last_success clock applies. 3600s = 1h = 3x the 20min cadence.
      - alert: AlphalensJobStale
        expr: time() - alphalens_job_last_success_timestamp_seconds{job="saxo-refresh"} > 3600
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: saxo-refresh
        annotations:
          summary: "saxo-refresh stale > 1h (expected 20min cadence)"
          description: "Last successful OAuth keep-alive was {{ $value | humanizeDuration }} ago — the refresh chain will die at the 40min window; re-run `alphalens broker auth`."

      - alert: AlphalensJobMetricMissing
        expr: absent(alphalens_job_last_success_timestamp_seconds{job="saxo-refresh"})
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: saxo-refresh
        annotations:
          summary: "saxo-refresh success metric missing"
          description: "No success metric for saxo-refresh. The keep-alive timer has not fired since metrics were enabled, or the scrape is broken. Clears after the first refresh."

      # -----------------------------------------------------------------
      # LIVE broker-manager instance (ADR 0017 standing-LIVE authorization;
      # design memo docs/research/broker_live_daemon_arm_design_2026_08_10.md
      # §5). A SECOND, ADDITIVE alphalens-broker-manager-live.service next to
      # the SIM instance above — same daemon code, distinct job labels
      # (metrics_job(env) / price_stream_metrics_job(env), ADR 0016) so the
      # two instances' health is never conflated.
      #
      # The absent()-based Missing rule below landed WITH the unit's VPS
      # enable (2026-08-11, design memo §7 step 1 "deploy inert") — it was
      # deliberately withheld until then because an absent() rule pages the
      # instant the rules file reloads when the instance does not exist yet
      # (ADR 0016 D5 precedent).
      # -----------------------------------------------------------------
      - alert: AlphalensBrokerManagerLiveHeartbeatStale
        expr: time() - alphalens_broker_manager_last_tick_timestamp_seconds{job="broker-manager-live"} > 300
        for: 2m
        labels:
          severity: warning
          route: telegram
          unit: broker-manager-live
        annotations:
          summary: "LIVE broker-manager heartbeat stale > 5m (expected ~45s ticks)"
          description: "Last control-loop tick was {{ $value | humanizeDuration }} ago — the LIVE auto-manager (REAL MONEY) may be wedged or stopped. Existing positions keep their disaster-stop protection independent of the daemon's own liveness; this alert is about placement/exit-management coverage going dark."

      - alert: AlphalensBrokerManagerLiveHeartbeatMissing
        expr: absent(alphalens_broker_manager_last_tick_timestamp_seconds{job="broker-manager-live"})
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: broker-manager-live
        annotations:
          summary: "LIVE broker-manager heartbeat metric missing"
          description: "No heartbeat gauge for the LIVE auto-manager (REAL MONEY). The daemon has not ticked since metrics were enabled, or the textfile collector / node_exporter scrape is broken. Clears after the first tick."

      - alert: AlphalensLivePriceStreamReaderDown
        # Same anti-false-positive gate as the SIM version: an idle reader
        # (nothing subscribed) holds no WebSocket BY DESIGN and must not
        # page. Distinguishing `unit: broker-manager-live` label keeps this
        # rule's static label set distinct from the SIM twin above (same
        # alertname, different job+unit) so promtool does not see a
        # duplicate rule.
        expr: >-
          alphalens_live_price_stream_reader_up{job="live-price-stream-live"} == 0
          and alphalens_live_price_stream_subscribed_uics{job="live-price-stream-live"} > 0
        for: 10m
        labels:
          severity: warning
          route: telegram
          unit: broker-manager-live
        annotations:
          summary: "LIVE price stream reader down while uics are subscribed (REAL MONEY)"
          description: "The Saxo LIVE price feed reader is not running but positions still want live prices — trailing/live exits are dark (protection pass unaffected). The daemon rebuilds the reader on demand; sustained reader_up=0 means the rebuild loop itself is failing. This is the daemon's own order/price session (design memo §6 sole-elevated-holder topology) — no shared reader to fail over to."

      - alert: AlphalensLivePriceStreamStale
        # No frame for 5m while subscribed and the reader claims to be up:
        # the dark-but-connected case observability exists to catch.
        # `unless session_asleep == 1` drops the session gate's intentional
        # overnight sleep — see the SIM twin above for the full rationale
        # (absent-gauge fail-open, wrong-False residual).
        expr: >-
          (time() - alphalens_live_price_stream_last_frame_timestamp_seconds{job="live-price-stream-live"}) > 300
          and alphalens_live_price_stream_subscribed_uics{job="live-price-stream-live"} > 0
          and alphalens_live_price_stream_reader_up{job="live-price-stream-live"} == 1
          unless alphalens_live_price_stream_session_asleep{job="live-price-stream-live"} == 1
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: broker-manager-live
        annotations:
          summary: "LIVE price stream silent > 5m with subscriptions active (REAL MONEY)"
          description: "The reader is up and uics are subscribed but no frame has arrived for {{ $value | humanizeDuration }} — the feed is dark-but-connected. Recv timeout + resubscribe should self-heal; sustained staleness means they are not. Verify DelayedByMinutes==0 separately — a silent demotion to delayed data would NOT trip this rule (frames keep arriving, just stale-priced)."

      # LIVE market-data OAuth idle keep-alive (alphalens-saxo-marketdata-
      # refresh.{service,timer}, design memo §5) — same job-metrics shape as
      # saxo-refresh above (timer-driven oneshot, ~20min cadence), distinct
      # job label so a dead LIVE chain never hides behind the SIM/order-chain
      # refresh's own last_success. 3600s = 1h = 3x the 20min cadence
      # (same threshold class as saxo-refresh).
      - alert: AlphalensJobStale
        expr: time() - alphalens_job_last_success_timestamp_seconds{job="saxo-marketdata-refresh"} > 3600
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: saxo-marketdata-refresh
        annotations:
          summary: "saxo-marketdata-refresh stale > 1h (expected 20min cadence)"
          description: "Last successful LIVE market-data OAuth keep-alive was {{ $value | humanizeDuration }} ago — the saxo_auth_live refresh chain will die at the 40min window, degrading the LIVE daemon's real-time price feed to 15min-delayed (or dead). Re-run `alphalens broker marketdata-auth --refresh`."

      - alert: AlphalensJobMetricMissing
        expr: absent(alphalens_job_last_success_timestamp_seconds{job="saxo-marketdata-refresh"})
        for: 5m
        labels:
          severity: warning
          route: telegram
          unit: saxo-marketdata-refresh
        annotations:
          summary: "saxo-marketdata-refresh success metric missing"
          description: "No success metric for saxo-marketdata-refresh. The keep-alive timer has not fired since metrics were enabled, or the scrape is broken. Clears after the first refresh."
