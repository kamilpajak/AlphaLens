# How many open brackets + positions the SIM soak may hold at once.
#
# 25 (vs 2 on LIVE): SIM is the sample-collection lab — the point of the soak
# is to accumulate ladder outcomes and execution telemetry quickly, and paper
# fills carry no exposure. Set on the host 2026-08-11 alongside the SIM
# sizing-frame work; tracked here since #1136.
#
# Raised 10 -> 25 on 2026-08-28: the rail is a sum of open entry-trail WATCHES
# plus net-open POSITIONS, and at 10 it had become the binding constraint on
# sample collection rather than a risk control. Measured that day: 7 watches
# still waiting from the 08-25/08-26 briefs (only 3 picks had ever touched
# their tier limit) plus 3 filled positions = exactly 10, so all three picks
# of the 2026-08-27 brief were terminally refused before the market had been
# open twenty minutes. Watches sit for up to the 7-day order TTL, so the
# refusals were not a transient burst — the cap would have rejected every new
# pick for days.
#
# Why 25 and not "off": the sum still bounds concurrent risk units, and the
# entry-watch rail (41-entry-watch-cap.conf) independently caps how many picks
# may WAIT at once, so 25 leaves headroom for positions to accumulate as
# watches convert to fills without the two rails fighting each other. The
# account stays protected by the virtual gross/cash reservation fold, which is
# denominated in money rather than in slots.
[Service]
Environment=ALPHALENS_BROKER_MAX_OPEN=25
