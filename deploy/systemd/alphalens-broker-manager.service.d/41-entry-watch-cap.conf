# Entry-trail watch capacity: how many DISTINCT picks may hold an open watch
# at once (the default is 1 per the 2026-08-19 ETSY live incident). Raised on
# SIM 2026-08-27 for the breakeven_trail soak (#1162/#1166 evidence needs
# several concurrent positions, and with ENTRY_TRAIL_BPS=50 every pick routes
# through the watch, so cap=1 serializes the whole queue), then to the rail MAX
# later the same day.
#
# 25 since 2026-08-28 (#1189), together with the code ceiling it sits at. The
# old MAX of 10 was reached the same day: seven picks from the 08-25/08-26
# briefs still held watch slots (only three had ever touched their tier limit),
# so the three picks of the 08-27 brief were deferred with
# "entry-trail watch capacity reached (cap=10) — stays armed". A watch holds
# its slot until it fills or hits the 7-day order TTL, so that would not have
# cleared on its own for days.
#
# On SIM the value is the DATA: the point of the soak is to accumulate ladder
# outcomes and execution telemetry, and paper fills carry no exposure. The
# account stays protected by the virtual gross/cash reservation fold plus
# MAX_OPEN (25, see 20-max-open.conf), not by this number.
#
# SIM-only judgement. The LIVE unit keeps its own pin of 4, and since #1189
# `live_rails.assert_live_rails` bounds the LIVE value to [1, 4] and refuses to
# boot on unset — so this SIM value can move without touching LIVE.
[Service]
Environment=ALPHALENS_BROKER_ENTRY_WATCH_MAX_PICKS=25
