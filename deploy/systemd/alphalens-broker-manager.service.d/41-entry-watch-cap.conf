# Entry-trail watch capacity: 10 concurrent watched picks (the env rail's hard
# MAX; default is 1 per the 2026-08-19 ETSY live incident). Raised on SIM
# 2026-08-27 for the breakeven_trail soak (#1162/#1166 evidence needs several
# concurrent positions, and with ENTRY_TRAIL_BPS=50 every pick routes through
# the watch, so cap=1 serializes the whole queue), then to the rail MAX later
# the same day — on SIM the value is the DATA, and the account stays protected
# by the virtual gross/cash reservation fold plus MAX_OPEN, not by this
# number. SIM-only judgement — the LIVE unit keeps its own pin.
[Service]
Environment=ALPHALENS_BROKER_ENTRY_WATCH_MAX_PICKS=10
