# Behavioral exit policy: breakeven_trail (lens-faithful port of the
# be_0p5r_trail0p6 what-if lens), on since 2026-08-27 (owner decision,
# issue #1162; replaces trailing_atr, on 2026-08-10..2026-08-27). Places NO
# geometry — the brief's TP tranche ladder + brief disaster stop are placed
# and the policy manages ONLY the stop: dark until peak >= entry + 0.5R
# (1R = filled blend - brief disaster stop), then ratchets to
# max(entry, entry + 0.6*(peak - entry)). The boot gate refuses this policy
# on a broker without the SupportsAmendStop CAPABILITY (a Saxo broker has
# it) — independent of the 60-amend.conf flag, which gates only Stage-3
# grow/downsize amends. Peak updates read off the stream from
# 50-streaming.conf; a stream loss degrades trailing to a held stop, never
# to no stop.
[Service]
Environment=ALPHALENS_BROKER_EXIT_POLICY=breakeven_trail
