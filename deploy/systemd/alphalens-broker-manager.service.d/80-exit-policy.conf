# Behavioral exit policy: bot-amend Chandelier trailing stop, Tor A (#1008),
# on since 2026-08-10. Requires 60-amend.conf (the boot gate refuses
# trailing_atr on a broker without amend support) and reads its peaks off the
# stream from 50-streaming.conf.
[Service]
Environment=ALPHALENS_BROKER_EXIT_POLICY=trailing_atr
