# Behavioral exit policy: bot-amend Chandelier trailing stop, Tor A (#1008),
# on since 2026-08-10. The boot gate refuses this policy on a broker without
# the SupportsAmendStop CAPABILITY (a Saxo broker has it) — independent of
# the 60-amend.conf flag, which gates only Stage-3 grow/downsize amends.
# Peak updates read off the stream from 50-streaming.conf; a stream loss
# degrades trailing to a held stop, never to no stop.
[Service]
Environment=ALPHALENS_BROKER_EXIT_POLICY=trailing_atr
