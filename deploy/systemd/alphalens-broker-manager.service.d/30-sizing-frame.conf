# The declared sizing frame for SIM (path-A memo
# docs/research/broker_sizing_declared_frame_design_2026_08_12.md §4.1).
#
# 100000 declared: the Saxo SIM account carries a fictional balance, so the
# frame is pinned to a round number that keeps per-tier notionals large enough
# to exercise the venue lattice and the fee model realistically. `declared`
# mode sizes against this frame, not against the paper account snapshot —
# same mechanism as LIVE (which declares 20000 PLN), different number and a
# different currency — the SIM account is EUR-denominated, LIVE is PLN.
[Service]
Environment=ALPHALENS_BROKER_SIZING_EQUITY=100000
Environment=ALPHALENS_BROKER_SIZING_EQUITY_MODE=declared
