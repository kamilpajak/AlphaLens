# Stop-amend path (on since 2026-07-24): lets the manager reposition the
# disaster stop by amending the working order instead of cancel+replace.
# Unset means off; the boot gate refuses the trailing policy without a broker
# that supports amends, so this flag and 80-exit-policy.conf travel together.
[Service]
Environment=ALPHALENS_BROKER_AMEND_ENABLED=1
