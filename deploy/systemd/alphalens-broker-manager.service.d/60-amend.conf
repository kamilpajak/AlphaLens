# Stage-3 grow/downsize stop amends (on since 2026-07-24): lets the manager
# resize the disaster stop by amending the working order instead of
# cancel+replace. Unset means off.
#
# NOT what makes the trailing policy possible: the trailing_atr boot gate
# checks the broker CAPABILITY (SupportsAmendStop), deliberately not this
# flag (control_loop.build_default_deps — "Gate on the CAPABILITY, NOT on
# _amend_enabled()"). This flag gates only the grow/downsize path.
[Service]
Environment=ALPHALENS_BROKER_AMEND_ENABLED=1
