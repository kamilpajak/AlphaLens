# The cash floor for SIM: a pick is refused when its planned entries plus the
# entries already resting exceed the margin available (x 1.04). The variable
# name is historical — it used to select how the sizing frame was resolved, and
# since #1467 a pick states its own amount, so `declared` only switches the
# cash floor on. LIVE sets the same value in its base unit.
[Service]
Environment=ALPHALENS_BROKER_SIZING_EQUITY_MODE=declared
