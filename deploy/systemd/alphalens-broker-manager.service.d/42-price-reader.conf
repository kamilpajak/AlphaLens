# Read prices from the shared reader instead of opening a second elevated Saxo
# session (#1172).
#
# Saxo grants one elevated session per LIVE login. Before the reader, having
# both daemons on live prices demoted BOTH to 15-minute quotes, so the runbook
# told the operator to turn LIVE prices OFF here — which is why the
# breakeven_trail soak collected no fills for weeks. With the socket set, this
# daemon reads the reader's single session and opens no stream of its own, so
# SIM can have real-time prices again while the LIVE daemon keeps its own.
#
# Both lines are load-bearing together: the socket alone does nothing while
# ALPHALENS_SAXO_LIVE_PRICES is off (that flag stays the master switch), and
# the flag alone would open a competing stream.
#
# ROLLBACK: delete this file, `systemctl --user daemon-reload`, restart the
# daemon. That restores the in-process path exactly, with no code change.
# Restart OUTSIDE XNYS hours (13:30-20:00 UTC) — a restart resets the
# in-memory trailing peaks.
[Service]
Environment=ALPHALENS_SAXO_PRICE_READER_SOCKET=%h/.alphalens/price_reader/reader.sock
Environment=ALPHALENS_SAXO_LIVE_PRICES=1
