# The resting-OCO/TP path is RETIRED on SIM: replaced by the live-market exit
# engine (70-live-market-exits.conf), and position-attached exits fail on this
# netting SIM account anyway (see memory/runbook: Saxo netting forbids
# position-attached exits, 2026-08-04).
#
# The code treats unset as off (`== "1"` gate in position_manager.py), so this
# file changes nothing the daemon does. It exists because this variable is the
# one that went contradictory when it was untracked: the host grew
# `oco-enable.conf` (2026-07-24) and then `zz-oco-disable.conf` (2026-08-06),
# the `zz-` prefix winning systemd's lexical ordering. Keeping the explicit 0
# preserves byte-parity of the composed environment across the #1136 cutover
# and records the retirement where the next operator will look. Delete this
# file only together with the OCO code path itself.
[Service]
Environment=ALPHALENS_BROKER_OCO_ENABLED=0
