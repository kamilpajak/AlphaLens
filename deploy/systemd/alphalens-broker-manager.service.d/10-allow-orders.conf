# Master placement arm — SIM (paper) only; no real money behind this unit.
#
# The SIM daemon has run armed since the MVP went live on 2026-07-21 (#876).
# Kept out of the base unit anyway: the base file doubles as the template the
# LIVE unit was derived from, and the doctrine since #1134 is that installing
# a base unit must never be the act that starts placing orders — arming is
# always a separate, deliberate file, on both rails.
[Service]
Environment=ALPHALENS_BROKER_ALLOW_ORDERS=1
