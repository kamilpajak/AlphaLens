# Trailing entries (memo docs/research/entry_trailing_design_2026_08_12.md).
#
# 50 bps, on since 2026-08-14 — SIM soaked this before LIVE adopted the same
# value. As on LIVE, the flag also SELECTS WHICH ARM GATES RUN: the #1112
# exit-region gate and the single-tranche exit contract live on the
# trailing-entry path, and `_geometry_without_entry_trail_note` refuses to arm
# new entries when the geometry policy is active with the trail off.
#
# ENTRY_WATCH_MAX_PICKS is deliberately NOT set here: SIM runs the code
# default of 1 (LIVE overrides it to 2).
[Service]
Environment=ALPHALENS_BROKER_ENTRY_TRAIL_BPS=50
