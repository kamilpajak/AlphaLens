# Pin Arrow's CPU thread pool to one worker, to stop the `--replay` step aborting
# at process teardown (issue #1858).
#
# WHAT IT FIXES. pyarrow 24.0.0's `arrow::py::PyReadableFile` destructor touches
# the GIL while the interpreter is finalizing. Its guard is `Py_IsInitialized()`,
# which is still TRUE during finalization, so it stops nothing; `PyGILState_Ensure`
# reaches `PyThread_exit_thread()`, that unwinds through a `noexcept` destructor,
# and libstdc++ calls `std::terminate`. The journal shows it as
# `terminate called without an active exception` / `Aborted (core dumped)`, with no
# Python traceback, because it is the C++ runtime and not an exception.
# pandas 3.0.6 supplies the trigger: `pandas/io/parquet.py` hands pyarrow an open
# file object rather than a path. Upstream apache/arrow#54536, open, no PR.
#
# WHY THIS VARIABLE. Arrow 24.0.0 reads ONLY `OMP_NUM_THREADS` for its CPU
# thread-pool capacity — there is no `ARROW_*` variable for it, and
# `ARROW_IO_THREADS` sizes a different pool. Measured on the VPS:
#
#   (none)                 cpu 8  io 8
#   OMP_NUM_THREADS=1      cpu 1  io 8
#   ARROW_IO_THREADS=1     cpu 8  io 1
#
# And in a container on the host's exact versions (Python 3.13.7, pyarrow 24.0.0,
# pandas 3.0.6, numpy 2.5.0), over 3000 processes per arm: 10 aborts with nothing
# set, 12 with `ARROW_IO_THREADS=1` alone, 0 with `OMP_NUM_THREADS=1`. So the CPU
# pool is the lever and the IO pool is not.
#
# WHAT IT DOES NOT CHANGE. The Arrow thread pool only affects how parallel a
# parquet scan is; the rows are identical. It is also marginally FASTER here,
# because the largest file this job reads is 950 KB and starting eight workers
# costs more than it saves: 0.74 s against 0.96 s to read the whole store. The
# run's wall clock is set by Polygon's 5 req/min anyway — 9min54s of CPU inside
# 2h16m elapsed.
#
# REACH OF THE NAME. `OMP_NUM_THREADS` is also read by OpenBLAS under numpy, as a
# fallback after `OPENBLAS_NUM_THREADS`. This job does no linear algebra, so
# nothing here is affected; if a later change to it does, add
# `OPENBLAS_NUM_THREADS=8` beside this line and Arrow's pool stays at 1.
#
# NOT A CPYTHON BUMP. Python 3.13.8 replaced `PyThread_exit_thread()` with
# `PyThread_hang_thread()` (gh-87135), which turns this abort into a HANG: the
# worker blocks and the main thread waits in `ThreadPool::Shutdown`. Against
# `TimeoutStartSec=180min` that trades a 10-minute failure for a three-hour
# blocked slot. Upstream apache/arrow#50482, open.
#
# This is a workaround, not the cure. The cure is to open the file natively before
# it reaches pandas (`read_parquet_native()` beside `write_parquet_atomic` in
# `alphalens_pipeline/data/parquet_io.py`); #1858 carries the call-site list.
[Service]
Environment=OMP_NUM_THREADS=1
