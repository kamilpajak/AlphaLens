# The venue set the stream session window is computed over (#1238 PR 5,
# first TRACKED value in #1271). The window is the per-day HULL over these
# venues' sessions (earliest open - warmup .. latest close + grace), holiday-
# aware per venue off the real exchange calendars; venues here do NOT
# subscribe anything by themselves — per-uic subscriptions still come from
# watches/positions. Unset falls back to ("XNYS",) in code.
#
# CONFIG DOCTRINE (#1209): this value lives in a tracked drop-in and NOWHERE
# else. Never put it in /etc/alphalens/env — EnvironmentFile= overrides every
# Environment= line, in-unit and drop-in alike — and never hand-edit it on the
# host: the hourly drift-check compares the composed environment against
# origin/main and pages on any divergence.
[Service]
Environment=ALPHALENS_SAXO_STREAM_SESSION_VENUES=XNYS,XWAR,XETR
