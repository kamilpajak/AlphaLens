# How much may be at risk at once. The two values are NOT two views of the
# same thing, and neither is the declared sizing frame:
#
#   MAX_OPEN          a count of open brackets + positions
#   GROSS_FRAC        a fraction of the REAL account value, not of the frame
#
# ALPHALENS_BROKER_SIZING_EQUITY (30-sizing-frame.conf) decides how large a
# position is; this caps what may be committed in total, denominated against
# `account.total_value` straight off the broker. Funding the account moves this
# cap. It does not move position size.
#
# MAX_OPEN=2 — the operator wanted two concurrent positions. That is the whole
# reason, recorded here because an unexplained number invites someone to
# "clean it up" later.
#
# MAX_OPEN 2 -> 4 on 2026-09-04 — operator decision. The WhatsApp manual flow
# (`broker arm-manual`, #1235) arms two or more picks a day on top of the
# positions already held, and two slots forced a disarm-to-arm trade every
# morning (NOV+AVTR retired for RHI on 09-02 is the recorded example).
# GROSS_FRAC stays 0.5, so the implied share of real equity per position falls
# from 25% to 12.5% — this widening adds names, not gross. The entry-watch
# capacity in 40-entry-trail.conf moved with it (one watch slot per position
# slot).
#
# GROSS_FRAC 0.25 -> 0.5 — sizing memo
# docs/research/broker_sizing_declared_frame_design_2026_08_12.md §7 decision 2
# (LOCKED 2026-08-12). The old pre-sizing gross check was broken three ways —
# it compared instrument-currency (USD) gross against an account-currency (PLN)
# limit, roughly 3.7x looser than it read; it ran before sizing, so the first
# pick of any size always passed; and it counted only WORKING verdicts, so
# filled exposure dropped out. PR-0 replaced it with a candidate-inclusive,
# account-currency check after sizing. The pin was raised in the same breath
# BECAUSE of that repair: 0.25 of a cap that did not work is not a quarter of
# anything, while 0.5 of the repaired cap is a real half. It is also the
# boot-assert maximum, and it binds identically in `clamped` and `declared`
# modes — always against real equity, never against the frame.
#
# Standing rule adopted with the frame (memo §6): demand at least 5% headroom
# between candidate gross and this budget. The budget is 0.5 x mark-to-market
# total value and drifts daily on FX and open-position marks, so a sub-2%
# margin makes pass/refuse a coin flip — and a refusal at drain time is
# terminal.
#
# Both values sit exactly AT the ceiling `assert_live_rails()` permits
# (MAX_OPEN in [1, 4], GROSS_FRAC in (0, 0.5]), so neither can be widened
# further from a unit file — that takes a reviewed edit to `live_rails.py`.
[Service]
Environment=ALPHALENS_BROKER_MAX_OPEN=4
Environment=ALPHALENS_BROKER_PORTFOLIO_GROSS_FRAC=0.5
