# How much may be at risk at once: GROSS_FRAC, a fraction of the REAL account
# value. It is not a pick's size.
#
# A pick states its own amount (#1467), bounded by
# ALPHALENS_BROKER_MAX_PICK_NOTIONAL (30-max-pick-notional.conf); this caps what
# may be committed in total, denominated against
# `account.total_value` straight off the broker. Funding the account moves this
# cap. It does not move position size.
#
# There is no count of positions any more. ALPHALENS_BROKER_MAX_OPEN lived here
# (1 -> 2 -> 4 -> 10) until #1732 (owner decision 2026-10-05): free capital is
# the only limit on how many picks LIVE takes. The money rails bound the
# account: this gross cap, the cash floor (candidate x 1.04 + resting entries +
# watching reservations <= margin available, switched on in the base unit), the
# per-pick amount and the fee floor. A pick that does not fit is refused
# terminally and must be re-armed by hand; it is not held until money frees up.
#
# GROSS_FRAC 0.25 -> 0.5 — sizing memo
# docs/research/broker_sizing_declared_frame_design_2026_08_12.md §7 decision 2
# (LOCKED 2026-08-12). The old pre-sizing gross check was broken three ways —
# it compared instrument-currency (USD) gross against an account-currency (PLN)
# limit, roughly 3.7x looser than it read; it ran before sizing, so the first
# pick of any size always passed; and it counted only WORKING verdicts, so
# filled exposure dropped out. PR-0 replaced it with a candidate-inclusive,
# account-currency check after sizing. The pin was raised in the same breath
# BECAUSE of that repair: 0.25 of a cap that did not work is not a quarter of
# anything, while 0.5 of the repaired cap is a real half.
#
# GROSS_FRAC 0.5 -> 1.0 on 2026-09-08 — operator decision. The operator bounds
# risk by DIVERSIFICATION across names rather than by a fraction of equity held
# back: the whole account may be committed, never more. 1.0 is the no-leverage
# line (no margin agreement on the account) and the boot-assert ceiling.
#
# Standing rule adopted with the frame (memo §6): demand at least 5% headroom
# between candidate gross and this budget. The budget is GROSS_FRAC x
# mark-to-market total value and drifts daily on FX and open-position marks,
# so a sub-2% margin makes pass/refuse a coin flip — and a refusal at drain
# time is terminal.
#
# The value sits exactly AT the ceiling `assert_live_rails()` permits
# (GROSS_FRAC in (0, 1.0]), so it cannot be widened further from a unit file —
# that takes a reviewed edit to `live_rails.py`.
[Service]
Environment=ALPHALENS_BROKER_PORTFOLIO_GROSS_FRAC=1.0
