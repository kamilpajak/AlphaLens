# How much of the frame may be at risk at once.
#
# Both values sit exactly AT the ceiling `assert_live_rails()` allows for the
# soak (MAX_OPEN in [1, 2], PORTFOLIO_GROSS_FRAC in (0, 0.5]), so neither can
# be widened further from a unit file — that would take a reviewed edit to
# `live_rails.py`.
#
# Changed on the VPS 2026-08-12, in the same edit as the sizing frame and the
# fee floor (file mtime 13:29 CEST). The RATIONALE was never written down
# anywhere — not in a commit, an ADR or a memo — which is half of what issue
# #1121 is about. Attributing the two values to that one edit is inference
# from the file timestamp, not a measurement; the values themselves are read
# from the running unit.
[Service]
Environment=ALPHALENS_BROKER_MAX_OPEN=2
Environment=ALPHALENS_BROKER_PORTFOLIO_GROSS_FRAC=0.5
