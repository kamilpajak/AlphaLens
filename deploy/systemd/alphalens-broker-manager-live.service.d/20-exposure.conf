# How much may be at risk at once. The two values are NOT two views of the
# same thing, and neither is the declared sizing frame:
#
#   MAX_OPEN          a count of open brackets + positions
#   GROSS_FRAC        a fraction of the REAL account value, not of the frame
#
# `safety.check` computes `gross_limit = GROSS_FRAC * broker_view.equity`, and
# that equity is `account.total_value` straight off the broker — so this caps
# total committed gross at half of whatever is actually in the Saxo account,
# while ALPHALENS_BROKER_SIZING_EQUITY (30-sizing-frame.conf) decides how large
# any single position is. Funding the account moves this cap; it does not move
# position size.
#
# MAX_OPEN=2 — the operator wanted two concurrent positions. That is the whole
# reason, recorded here because an unexplained number invites someone to
# "clean it up" later.
#
# GROSS_FRAC=0.5 — the rationale was NOT recorded when it changed, and is not
# reconstructible: no commit, ADR or memo carries it, and the only evidence is
# the unit file's 2026-08-12 mtime. Stated plainly rather than invented. What
# is certain is that 0.5 is the widest the live-soak allows.
#
# Both sit exactly AT the ceiling `assert_live_rails()` permits (MAX_OPEN in
# [1, 2], GROSS_FRAC in (0, 0.5]), so neither can be widened further from a
# unit file — that would take a reviewed edit to `live_rails.py`.
[Service]
Environment=ALPHALENS_BROKER_MAX_OPEN=2
Environment=ALPHALENS_BROKER_PORTFOLIO_GROSS_FRAC=0.5
