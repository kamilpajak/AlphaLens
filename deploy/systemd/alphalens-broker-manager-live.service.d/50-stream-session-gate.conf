# Only hold the shared price stream open inside the trading session.
#
# Outside market hours no frames flow, so a 24/7 WebSocket times out every few
# minutes and churns through reconnect plus subscription-recreate all night.
# The gate opens the window [session open - 15 min, session close + 10 min] off
# the real XNYS calendar (holidays, early closes, DST).
#
# Not a risk rail: the stream side is fail-open by contract, so a raising
# calendar predicate can never silence quotes during trading hours. Enabled on
# the VPS 2026-08-20. Unset means off, which is why the base unit's silence
# about it was a real gap rather than a harmless omission.
[Service]
Environment=ALPHALENS_SAXO_STREAM_SESSION_GATE=1
