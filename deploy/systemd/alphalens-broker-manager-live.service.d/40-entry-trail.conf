# Trailing entries (memo docs/research/entry_trailing_design_2026_08_12.md §6).
#
# Turned on 2026-08-14 on the VPS; the watch fan-out was raised to 2 picks on
# 2026-08-20 (drop-in mtime 12:20 CEST). The base unit ships 0 = feature off.
#
# This flag also SELECTS WHICH ARM GATES RUN, which is why it is not just a
# tuning knob. The #1112 exit-region gate and the single-tranche exit contract
# live on the trailing-entry path only. With the trail off and the geometry
# exit policy active, `_geometry_without_entry_trail_note` refuses to arm any
# new entry and alerts, rather than letting the pick fall through to the
# classic bracket path that has neither gate. Verified by execution on
# 2026-08-25: bps=0 refuses, bps=50 arms. So running the base unit alone stops
# new entries loudly; it does not trade them unguarded.
#
# ENTRY_WATCH_MAX_PICKS is bounded [1, 10] in code and defaults to 1 when unset.
[Service]
Environment=ALPHALENS_BROKER_ENTRY_TRAIL_BPS=50
Environment=ALPHALENS_BROKER_ENTRY_WATCH_MAX_PICKS=2
