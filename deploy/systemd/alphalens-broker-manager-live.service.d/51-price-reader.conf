# Read prices from the shared reader instead of holding the elevated Saxo
# session directly (#1172).
#
# The LIVE daemon used to BE the sole elevated holder, which is why the runbook
# told the operator to turn LIVE prices off on SIM. It now reads the reader's
# single session like SIM does, so neither daemon competes for the elevation
# and neither can demote the other.
#
# ALPHALENS_SAXO_LIVE_PRICES=1 stays pinned IN THE UNIT (line 171) — the master
# switch for the risk-bearing instance is not delegated to a drop-in. This file
# only redirects WHERE the prices come from.
#
# The session gate lives in 50-stream-session-gate.conf and is now inert here:
# the daemon no longer owns a stream to gate. Kept rather than deleted so a
# rollback of this file restores the previous behaviour completely.
#
# ROLLBACK: delete this file, `systemctl --user daemon-reload`, restart the
# daemon OUTSIDE XNYS hours (13:30-20:00 UTC). It then opens its own stream
# again — and SIM must go back to LIVE prices OFF, or both demote.
# Start after the reader when both come up together (a reboot). NOT Requires=:
# a reader that fails to start must never block a trading daemon — the client
# vetoes quotes and retries on its own, and the daemon still reconciles and
# still manages the standalone disaster stop. This only spares a veto tick or
# two at boot; it is not a correctness dependency.
#
# (It does NOT guard against "the daemon opens its own stream first": a drop-in
# is part of the loaded unit, so once this file is installed the daemon can
# never start without the socket. Verified on the VPS 2026-08-27 —
# `systemctl --user show ... -p Environment` shows drop-in values.)
[Unit]
Wants=alphalens-saxo-price-reader.service
After=alphalens-saxo-price-reader.service

[Service]
Environment=ALPHALENS_SAXO_PRICE_READER_SOCKET=%h/.alphalens/price_reader/reader.sock
