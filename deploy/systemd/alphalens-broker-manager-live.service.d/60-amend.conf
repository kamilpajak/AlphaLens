# Stage-3 grow/downsize stop amends, turned on for LIVE 2026-09-23 (the SIM
# unit has run it since 2026-07-24, see ../alphalens-broker-manager.service.d/
# 60-amend.conf). Unset means off.
#
# Why: with amends off, each entry fill after the first is answered by B1
# additive, which places a SECOND standalone stop for the new shares instead of
# growing the one that exists. `_sole_standalone_stop` returns None while more
# than one stop rests, so for the rest of the position's life the declared
# trailing stop never moves and no take-profit tranche fires. Observed on LIVE
# for RHI 2026-09-02 (3 stops) and UBER 2026-09-08 (2 stops); issue #1514.
#
# With this flag the deficit arm amends the sole stop to the new quantity, so a
# position keeps exactly one stop. It does not merge stops that already exist.
#
# NOT what makes the trailing policy possible: that gate checks the broker
# CAPABILITY (SupportsAmendStop), not this flag.
[Service]
Environment=ALPHALENS_BROKER_AMEND_ENABLED=1
