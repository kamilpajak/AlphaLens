# Round-trip cost ceiling: a pick whose estimated round trip exceeds this many
# basis points is refused before placement.
#
# 150 -> 1000, sizing memo
# docs/research/broker_sizing_declared_frame_design_2026_08_12.md §7 decision 3
# (LOCKED 2026-08-12). Read the number with its label: this was RE-LABELLED
# from a cost cap to a DEGENERATE-CLASS BACKSTOP. It is not the fee floor being
# switched off.
#
# Why raise it: the daemon trades small notionals against a per-order minimum,
# so an honest per-tier round trip runs roughly 290-470 bps. The mode-A soak
# accepts that as the cost of validation. At 150 the rail refused everything it
# was handed — measured in the LIVE journal on 2026-08-11 15:56:12:
#
#   fee floor: NVAX round-trip 1036.7 bps > cap 150.0 bps (notional 20.27)
#   — pick refused
#
# Why it must never be unset: the fee floor is the ONLY rail that catches the
# tiny-notional class. The cash floor and the gross cap pass small amounts
# trivially, and the zero-quantity check misses low-priced stocks — which is
# exactly how a $20 position paying the fixed minimum twice got as far as it
# did. The boot-assert requires an explicit finite value above zero and offers
# no "off" token on purpose: a permanent off-switch to serve a temporary soak
# preference would contradict the pins doctrine.
#
# When to lower it: restore to 150 or below once the account is funded to a
# full frame (path-B target, operator-confirmed). The per-tier model journals
# `est_round_trip_fee_bps` on EVERY placement, not only refusals — that series
# is the calibration input for choosing the restored value.
#
# Bounded at this value in `live_rails.py` since 2026-08-25, so it cannot drift
# upward from a unit file.
[Service]
Environment=ALPHALENS_BROKER_MAX_FEE_BPS=1000
