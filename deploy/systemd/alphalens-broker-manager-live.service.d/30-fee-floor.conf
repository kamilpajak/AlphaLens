# Round-trip cost ceiling: a pick whose estimated round trip exceeds this many
# basis points is refused before placement.
#
# The live rail trades small notionals, and Saxo charges a per-order minimum,
# so the round trip in BASIS POINTS is large by arithmetic rather than by any
# fault in the pick. Measured, from the LIVE journal on 2026-08-11 15:56:12:
#
#   fee floor: NVAX round-trip 1036.7 bps > cap 150.0 bps (notional 20.27)
#   — pick refused
#
# A $20 position paying the fixed minimum twice is a ~1000 bps round trip. At
# the cap of 150 the rail refused everything it was being handed, so the cap
# was widened to 1000 on 2026-08-12 (unit file mtime 13:29 CEST).
#
# Read this as the honest statement it is: at these notionals the fee floor no
# longer refuses much, and the real defence against paying more in commission
# than the trade can earn is position size, not this number. Issue #1112 and
# the per-tranche cost gate added in #1116 are the mechanisms that do that
# work. Bounded at this value in `live_rails.py` since 2026-08-25.
[Service]
Environment=ALPHALENS_BROKER_MAX_FEE_BPS=1000
