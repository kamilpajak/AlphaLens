# The declared sizing frame (path-A memo
# docs/research/broker_sizing_declared_frame_design_2026_08_12.md §4.1): this
# pin IS the frame, and the cash floor plus the gross cap guard it. Saxo
# reserves nothing against a working order, so the frame cannot be inferred
# from the account snapshot.
#
# Widened 10000 -> 15000 on the VPS 2026-08-12 (file mtime 13:29 CEST),
# alongside the declared-frame work that landed as #1032-#1036.
#
# Widened 15000 -> 20000 on 2026-08-28 at the owner's explicit instruction,
# stated as a risk target rather than a frame: "~200 PLN risk per pick" (it
# was ~145 at 15000). The frame is the ONLY lever on per-pick risk — the risk
# a pick carries is frame x the brief's own suggested_size_pct x the entry-to-
# disaster-stop distance, and only the frame is ours to set. So a risk target
# can only be expressed here, and it applies to EVERY pick, not one of them.
#
# Worked example at the new frame, GME from the 2026-08-27 brief (replayed
# against the real PLN->USD leg, rate 0.2708): 75 shares over two tiers,
# 4853 PLN gross = 24.3% of the frame, 196 PLN to the disaster stop.
# Second-order effect worth stating: two such positions sit at 49% against the
# 50% PORTFOLIO_GROSS_FRAC cap, so at this frame MAX_OPEN=2 and the gross rail
# now bind at almost the same point. That is intended, not an oversight.
#
# This is the DIRECT multiplier on position size, and until 2026-08-25 the
# boot-assert checked it for positivity only — a typo of 150000 here booted
# clean and would have traded ten times the intended size. It is bounded at
# this value in `live_rails.py`, so raising the frame means editing code.
[Service]
Environment=ALPHALENS_BROKER_SIZING_EQUITY=20000
