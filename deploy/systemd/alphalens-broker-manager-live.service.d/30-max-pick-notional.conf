# The per-pick amount ceiling (#1467). A pick states its size as an amount in
# the account currency; before #1467 it was a percent of the sizing frame, and
# the frame ceiling (15000) was then the only bound on one pick's size. This
# carries the same number over, so nothing widens on the day it ships. It is
# bounded at this value in `live_rails.py`, so raising it means editing code.
#
# The drain refuses a pick above this before the day-1 gate, with one alert,
# and never shrinks it to fit.
[Service]
Environment=ALPHALENS_BROKER_MAX_PICK_NOTIONAL=15000
